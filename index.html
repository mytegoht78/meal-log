<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食事記録アプリ</title>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #fffaf3;
      color: #333;
    }
    h1 {
      font-size: 1.4em;
    }
    /* 本物の input は隠して、label をボタンに見せる */
    #camera {
      display: none;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    .camera-btn {
      flex: 1;
      display: block;
      padding: 16px 8px;
      border: none;
      background: #ff8a3d;
      color: #fff;
      font-family: inherit;
      font-size: 1em;
      font-weight: bold;
      text-align: center;
      border-radius: 12px;
      line-height: 1.4;
    }
    .camera-btn small {
      display: block;
      font-weight: normal;
      font-size: 0.75em;
      opacity: 0.9;
    }
    .camera-btn.quiet {
      background: #4a8f6a;
    }
    #status {
      min-height: 1.5em;
      margin: 8px 0;
      font-size: 0.9em;
      color: #888;
      text-align: center;
    }
    .record {
      background: #fff;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    .record img {
      display: block;
      width: 100%;
    }
    .record-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
    }
    .record-meta {
      font-size: 0.8em;
      color: #888;
    }
    .delete-btn {
      border: none;
      background: none;
      color: #c44;
      font-size: 0.9em;
      padding: 8px;
    }
    .empty {
      text-align: center;
      color: #aaa;
      margin-top: 32px;
    }

    /* ===== 静音カメラの画面（全画面） ===== */
    #quiet-cam {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10;
      flex-direction: column;
    }
    #quiet-cam.open {
      display: flex;
    }
    #quiet-video {
      flex: 1;
      width: 100%;
      min-height: 0;
      object-fit: contain;
    }
    .cam-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 20px 16px 32px;
    }
    .cam-bar button {
      border: none;
      background: none;
      color: #fff;
      font-family: inherit;
      font-size: 1em;
      width: 80px;
    }
    #shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #888;
    }
    #shutter:active {
      background: #ddd;
    }
    /* 音の代わりに、撮った瞬間に画面を白く光らせる */
    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #flash.on {
      opacity: 0.8;
      transition: none;
    }
    #cam-msg {
      position: absolute;
      top: 40%;
      left: 16px;
      right: 16px;
      color: #fff;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>食事記録アプリ</h1>

  <div class="buttons">
    <label for="camera" class="camera-btn">📷 カメラアプリ<small>きれい・音あり</small></label>
    <button id="open-quiet" class="camera-btn quiet">🔇 静音カメラ<small>音なし</small></button>
  </div>
  <input type="file" id="camera" accept="image/*" capture="environment">

  <div id="status"></div>
  <div id="list"></div>

  <!-- 静音カメラ -->
  <div id="quiet-cam">
    <video id="quiet-video" autoplay playsinline muted></video>
    <div id="cam-msg"></div>
    <div class="cam-bar">
      <button id="cam-cancel">キャンセル</button>
      <button id="shutter" aria-label="撮影"></button>
      <span style="width:80px"></span>
    </div>
    <div id="flash"></div>
  </div>

  <script>
    // ===== IndexedDB の準備 =====
    // データベース名 "meal-log"、その中に "records" という入れ物を作る
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('meal-log', 1);
        req.onupgradeneeded = () => {
          // 初回だけ実行される。id は自動で 1, 2, 3… と振られる
          req.result.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // 入れ物に対して1回の操作をする共通関数
    async function withStore(mode, action) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('records', mode);
        const req = action(tx.objectStore('records'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      });
    }

    const addRecord = (record) => withStore('readwrite', (s) => s.add(record));
    const getAllRecords = () => withStore('readonly', (s) => s.getAll());
    const deleteRecord = (id) => withStore('readwrite', (s) => s.delete(id));

    // ===== 写真の縮小 =====
    // 長い辺を 1000px にして JPEG に変換（数MB → 100〜200KB 程度になる）
    // source には写真ファイルでも、静音カメラの映像（video）でも渡せる
    async function resizeImage(source, maxSize = 1000) {
      const bitmap = await createImageBitmap(source);
      const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      return { blob, width: canvas.width, height: canvas.height };
    }

    // ===== 画面 =====
    const camera = document.getElementById('camera');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    let shownUrls = [];

    function formatDate(time) {
      const d = new Date(time);
      const week = '日月火水木金土'[d.getDay()];
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${d.getMonth() + 1}/${d.getDate()}(${week}) ${hh}:${mm}`;
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    const sourceLabel = { app: '📷', quiet: '🔇' };

    async function showList() {
      // 前回表示した画像のURLを解放（メモリ節約）
      shownUrls.forEach((url) => URL.revokeObjectURL(url));
      shownUrls = [];

      const records = await getAllRecords();
      records.reverse(); // 新しい順

      if (records.length === 0) {
        listEl.innerHTML = '<p class="empty">まだ記録がありません</p>';
        return;
      }

      const total = records.reduce((sum, r) => sum + r.photo.size, 0);
      listEl.innerHTML = `<p class="record-meta">${records.length}件・合計 ${formatSize(total)}</p>`;

      for (const r of records) {
        const url = URL.createObjectURL(r.photo);
        shownUrls.push(url);

        // 以前の記録には width などが無いので、あるものだけ表示する
        const meta = [sourceLabel[r.source], formatSize(r.photo.size)];
        if (r.width) meta.push(`${r.width}×${r.height}`);
        if (r.originalSize) meta.push(`元 ${formatSize(r.originalSize)}`);

        const div = document.createElement('div');
        div.className = 'record';
        div.innerHTML = `
          <img src="${url}" alt="食事の写真">
          <div class="record-info">
            <div>
              <div>${formatDate(r.createdAt)}</div>
              <div class="record-meta">${meta.filter(Boolean).join('・')}</div>
            </div>
            <button class="delete-btn">削除</button>
          </div>`;
        div.querySelector('.delete-btn').addEventListener('click', async () => {
          if (!confirm('この記録を削除しますか？')) return;
          await deleteRecord(r.id);
          showList();
        });
        listEl.appendChild(div);
      }
    }

    // 写真を縮小して保存 → 一覧を更新（どちらのカメラからも使う）
    async function savePhoto(source, sourceType, originalSize) {
      statusEl.textContent = '保存中…';
      try {
        const { blob, width, height } = await resizeImage(source);
        await addRecord({
          createdAt: Date.now(),
          photo: blob,
          width,
          height,
          source: sourceType,
          originalSize,
        });
        statusEl.textContent = `保存しました（${formatSize(blob.size)}）`;
        await showList();
      } catch (e) {
        statusEl.textContent = '保存に失敗しました：' + e.message;
      }
    }

    // ----- 方法1：カメラアプリ -----
    camera.addEventListener('change', async () => {
      const file = camera.files[0];
      if (!file) return;
      await savePhoto(file, 'app', file.size);
      camera.value = ''; // 同じ操作を続けてできるようにリセット
    });

    // ----- 方法2：静音カメラ（カメラ映像の1コマを保存するので音が鳴らない） -----
    const quietCam = document.getElementById('quiet-cam');
    const video = document.getElementById('quiet-video');
    const camMsg = document.getElementById('cam-msg');
    const flash = document.getElementById('flash');
    let stream = null;

    async function openQuietCam() {
      quietCam.classList.add('open');
      camMsg.textContent = 'カメラを起動中…';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment', // 背面カメラ
            width: { ideal: 1920 },
            height: { ideal: 1920 },
          },
          audio: false,
        });
        video.srcObject = stream;
        camMsg.textContent = '';
      } catch (e) {
        camMsg.textContent = e.name === 'NotAllowedError'
          ? 'カメラの使用が許可されていません。Chromeのアドレスバー左のアイコンから、カメラを「許可」にしてください。'
          : 'カメラを起動できませんでした：' + e.message;
      }
    }

    function closeQuietCam() {
      if (stream) stream.getTracks().forEach((t) => t.stop()); // カメラを止める
      stream = null;
      video.srcObject = null;
      quietCam.classList.remove('open');
    }

    document.getElementById('open-quiet').addEventListener('click', openQuietCam);
    document.getElementById('cam-cancel').addEventListener('click', closeQuietCam);

    document.getElementById('shutter').addEventListener('click', async () => {
      if (!stream || video.readyState < 2) return; // 映像がまだ来ていない
      // 白く光らせて「撮れた」ことを伝える
      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
      const bitmap = await createImageBitmap(video); // 今のコマを確保してからカメラを閉じる
      closeQuietCam();
      await savePhoto(bitmap, 'quiet', null);
    });

    // 静音カメラを開いたまま別のアプリに切り替えたら、カメラを止める
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && stream) closeQuietCam();
    });

    showList();
  </script>
</body>
</html>

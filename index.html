  <!-- ZIP ファイルを作る・読むためのライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --accent: #ff8a3d;
      --green: #4a8f6a;
      --blue: #4a76a8;
      --bg: #fffaf3;
      --text: #333;
      --sub: #888;
      --line: #e8e0d4;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      font-size: 1.4em;
      margin: 0 0 12px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
    }
    .hidden-input {
      display: none;
    }

    /* ===== ボタン類 ===== */
    .camera-btn {
      flex: 1;
      padding: 14px 4px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95em;
      font-weight: bold;
      text-align: center;
      border-radius: 12px;
      line-height: 1.4;
    }
    .camera-btn small {
      display: block;
      font-weight: normal;
      font-size: 0.72em;
      opacity: 0.9;
    }
    .camera-btn.quiet {
      background: var(--green);
    }
    .camera-btn.gallery {
      background: var(--blue);
    }
    .backup-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: #555;
      font-size: 0.9em;
      text-align: center;
      border-radius: 8px;
    }
    .summary {
      font-size: 0.8em;
      color: var(--sub);
      margin: 0 0 8px;
    }

    /* ----- 一覧（1日 = 4マス） ----- */
    .day {
      background: #fff;
      border-radius: 12px;
      padding: 10px 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    .day-head {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .day-title {
      font-weight: bold;
    }
    .day-title .today {
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75em;
      font-weight: normal;
    }
    .day-edit {
      margin-left: auto;
      padding: 4px 8px;
      border: none;
      background: none;
      color: var(--sub);
      font-size: 0.85em;
    }
    .filter {
      display: flex;
      align-items: center;
      gap: 4px;
      margin: 0 0 8px;
      font-size: 1em;
    }
    .filter select {
      padding: 6px 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 1em;
    }
    .filter select + select {
      margin-left: 4px;
    }
    .empty {
      color: var(--sub);
      text-align: center;
      padding: 24px 0;
    }
    .day-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .cell-label {
      font-size: 0.8em;
      color: var(--sub);
      text-align: center;
      margin-bottom: 3px;
    }
    .cell-box {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      border: none;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }
    /* 写真がなく文字だけのマス */
    .cell-box.text {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      border: 1px solid var(--line);
      background: #fff7ea;
      color: var(--text);
      font-size: 0.9em;
      line-height: 1.4;
    }
    .cell-box.text span {
      display: -webkit-box;
      -webkit-line-clamp: 4;
      -webkit-box-orient: vertical;
      overflow: hidden;
      word-break: break-all;
    }
    /* ひとこと */
    .hito {
      display: flex;
      gap: 10px;
      width: 100%;
      margin-top: 8px;
      padding: 8px 4px 0;
      border: none;
      border-top: 1px solid var(--line);
      background: none;
      color: var(--text);
      font-size: 0.95em;
      text-align: left;
    }
    .hito-label {
      flex: none;
      color: var(--sub);
      font-size: 0.85em;
      padding-top: 1px;
    }
    .hito-text {
      word-break: break-all;
    }
    .hito-text.blank {
      color: #bbb;
    }
    .cell-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cell-box.none {
      border: 1px dashed #ccc;
      background: #faf7f2;
      color: #bbb;
      font-size: 0.8em;
      line-height: 1.5;
    }
    /* 複数枚あるときの印 */
    .badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 0.72em;
    }

    /* ===== 重ねて表示する画面 ===== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
    }
    .overlay.open {
      display: flex;
      flex-direction: column;
    }
    /* 下から出るシート */
    .sheet-overlay {
      background: rgba(0, 0, 0, 0.45);
      justify-content: flex-end;
    }
    .sheet {
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      padding: 16px 16px 24px;
      max-height: 92vh;
      overflow-y: auto;
    }
    /* 上から出るシート（文字の入力用。キーボードに隠れない） */
    .sheet-overlay.top {
      justify-content: flex-start;
    }
    .sheet-overlay.top .sheet {
      border-radius: 0 0 16px 16px;
    }
    .sheet h2 {
      font-size: 1.1em;
      margin: 0 0 12px;
    }
    .label {
      font-size: 0.85em;
      color: var(--sub);
      margin: 14px 0 6px;
    }
    .note {
      font-size: 0.85em;
      color: var(--green);
      margin-top: 8px;
      min-height: 1.2em;
    }
    .thumb-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .thumb-row img {
      flex: none;
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }
    .types {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .type-btn {
      padding: 12px 0;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      color: inherit;
      font-size: 0.95em;
    }
    .type-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: bold;
    }
    .date-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 1em;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .actions button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 1em;
    }
    .btn-sub {
      border: 1px solid #ccc;
      background: #fff;
      color: inherit;
    }
    .btn-main {
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
    }
    .choose-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .choose-list .camera-btn {
      padding: 14px;
    }

    /* ----- 日の編集画面 ----- */
    #day-editor {
      background: var(--bg);
      overflow-y: auto;
      padding: 16px;
    }
    .ed-top {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .ed-top h2 {
      font-size: 1.2em;
      margin: 0;
    }
    .ed-top button {
      margin-left: auto;
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: inherit;
    }
    .ed-sec {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .ed-head {
      display: flex;
      align-items: center;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .ed-add {
      margin-left: auto;
      padding: 6px 12px;
      border: 1px dashed #bbb;
      border-radius: 8px;
      background: #fff;
      color: #555;
      font-size: 0.85em;
      font-weight: normal;
    }
    .ed-none {
      color: #bbb;
      font-size: 0.85em;
    }
    .ed-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .ed-photo {
      position: relative;
    }
    .ed-photo img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }
    .ed-photo.cover img {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
    }
    .ed-photo .star,
    .ed-photo .remove {
      position: absolute;
      top: 4px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 16px;
      line-height: 30px;
    }
    .ed-photo .star {
      left: 4px;
    }
    .ed-photo.cover .star {
      background: var(--accent);
    }
    .ed-photo .remove {
      right: 4px;
    }
    .ed-photo .ed-fav {
      position: absolute;
      top: 4px;
      left: 38px;
      font-size: 16px;
    }
    .ed-text {
      width: 100%;
      margin-top: 8px;
      padding: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 1em;
    }
    .ed-photo select {
      width: 100%;
      margin-top: 4px;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 0.8em;
    }

    /* ----- 写真の拡大表示 ----- */
    #viewer {
      background: #000;
      color: #fff;
      z-index: 15;
    }
    .viewer-top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 16px;
    }
    #viewer-cover {
      padding: 6px 12px;
      border: 1px solid #888;
      border-radius: 16px;
      background: none;
      color: #fff;
      font-size: 0.85em;
    }
    #viewer-cover.is-cover {
      border-color: var(--accent);
      background: var(--accent);
    }
    #viewer-close {
      margin-left: auto;
      border: none;
      background: none;
      color: #fff;
      font-size: 1.8em;
      padding: 0 12px;
    }
    #viewer-img {
      flex: 1;
      width: 100%;
      min-height: 0;
      object-fit: contain;
    }
    #viewer-info {
      padding: 12px 16px 24px;
      color: #bbb;
      font-size: 0.8em;
      text-align: center;
    }
    .viewer-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 64px;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.4em;
    }
    #viewer-prev {
      left: 0;
      border-radius: 0 8px 8px 0;
    }
    #viewer-next {
      right: 0;
      border-radius: 8px 0 0 8px;
    }

    /* ----- 静音カメラ ----- */
    #quiet-cam {
      background: #000;
      z-index: 20;
    }
    /* 横4：縦3 の枠。映像を枠いっぱいに表示し、見えている範囲だけを保存する */
    .cam-stage {
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .cam-frame {
      position: relative;
      width: min(100%, calc((100dvh - 150px) * 4 / 3));
      aspect-ratio: 4 / 3;
      overflow: hidden;
      background: #111;
    }
    #quiet-video {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    #viewer-text {
      padding: 0 16px;
      color: #fff;
      text-align: center;
      word-break: break-all;
    }
    .cam-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 20px 16px 32px;
    }
    .cam-bar button {
      width: 80px;
      border: none;
      background: none;
      color: #fff;
      font-size: 1em;
      white-space: nowrap;
    }
    #shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #888;
    }
    #shutter:active {
      background: #ddd;
    }
    /* 音の代わりに、撮った瞬間に画面を白く光らせる */
    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #flash.on {
      opacity: 0.8;
      transition: none;
    }
    #cam-msg {
      position: absolute;
      top: 40%;
      left: 16px;
      right: 16px;
      color: #fff;
      text-align: center;
    }

    /* ===== ページとボトムナビ ===== */
    body {
      padding-bottom: 96px;
    }
    .page {
      display: none;
    }
    .page.active {
      display: block;
    }
    .soon {
      padding: 60px 0;
      color: var(--sub);
      text-align: center;
      line-height: 1.8;
    }
    .bottom-nav {
      position: fixed;
      left: 0;
      right: 0;
      bottom: 0;
      z-index: 5;
      display: flex;
      align-items: flex-end;
      padding: 4px 4px calc(6px + env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: #fff;
    }
    .bottom-nav button {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1px;
      padding: 4px 0;
      border: none;
      background: none;
      color: var(--sub);
      font-size: 0.68em;
      white-space: nowrap;
    }
    .bottom-nav button span {
      font-size: 1.7em;
      line-height: 1.2;
      filter: grayscale(1);
      opacity: 0.55;
    }
    .bottom-nav button.active {
      color: var(--accent);
      font-weight: bold;
    }
    .bottom-nav button.active span {
      filter: none;
      opacity: 1;
    }
    .bottom-nav .nav-add {
      flex: none;
      justify-content: center;
      width: 58px;
      height: 58px;
      margin: -20px 6px 2px;
      border-radius: 50%;
      background: var(--accent);
      color: #fff;
      font-size: 2.2em;
      line-height: 1;
      box-shadow: 0 2px 8px rgba(255, 138, 61, 0.5);
    }

    /* ----- カレンダー ----- */
    .cal-head {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 10px;
    }
    .cal-head h1 {
      min-width: 8em;
      margin: 0;
      text-align: center;
    }
    .cal-head button {
      width: 44px;
      height: 40px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: inherit;
      font-size: 1.3em;
    }
    .cal-week,
    .cal-grid {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 3px;
    }
    .cal-week span {
      padding: 2px 0;
      color: var(--sub);
      font-size: 0.8em;
      text-align: center;
    }
    .cal-week .sun,
    .cal-day.sun .cal-num {
      color: #d33;
    }
    .cal-week .sat,
    .cal-day.sat .cal-num {
      color: #36c;
    }
    .cal-day {
      position: relative;
      aspect-ratio: 1;
      padding: 0;
      border: none;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
    }
    .cal-day img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cal-num {
      position: absolute;
      top: 2px;
      left: 4px;
      color: var(--text);
      font-size: 0.75em;
    }
    .cal-day.has-photo .cal-num {
      color: #fff;
      text-shadow: 0 0 3px rgba(0, 0, 0, 0.9);
    }
    .cal-day.today {
      outline: 2px solid var(--accent);
      outline-offset: -2px;
    }
    /* 写真はないが文字の記録がある日 */
    .cal-dot {
      position: absolute;
      left: 50%;
      bottom: 6px;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      border-radius: 50%;
      background: var(--accent);
    }
    #cal-today {
      display: block;
      width: auto;
      margin: 14px auto 0;
      padding: 8px 18px;
    }

    /* ----- 設定 ----- */
    .set-group {
      background: #fff;
      border-radius: 12px;
      padding: 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .set-title {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .set-radio {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 10px 4px;
      border-top: 1px solid var(--line);
    }
    .set-title + .set-radio {
      border-top: none;
    }
    .set-radio input {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--accent);
    }
    .set-radio small {
      display: block;
      color: var(--sub);
      font-size: 0.8em;
    }
    .set-group .backup-btn {
      display: block;
      width: 100%;
      margin-top: 8px;
    }
    .set-note {
      margin: 8px 0 0;
      color: var(--sub);
      font-size: 0.8em;
      line-height: 1.5;
    }

    .set-time {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
      border-top: 1px solid var(--line);
    }
    .set-title + .set-time {
      border-top: none;
    }
    .set-time select {
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 1em;
    }

    /* ----- お気に入り ----- */
    .heart {
      color: #bbb;
    }
    .heart.on {
      color: #e5527a;
    }
    .fav-btn {
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 17px;
      line-height: 30px;
    }
    .fav-btn.on {
      background: #fff;
      color: #e5527a;
    }

    /* ----- アルバム ----- */
    .album-checks {
      display: flex;
      flex-wrap: wrap;
      gap: 6px 14px;
      margin-bottom: 10px;
    }
    .album-checks label {
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .album-checks input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--accent);
    }
    .album-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px;
      margin: 0 -12px;
    }
    .album-item {
      position: relative;
      aspect-ratio: 1;
      background: #eee;
    }
    .album-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      cursor: pointer;
    }
    .album-item .fav-btn {
      position: absolute;
      right: 3px;
      bottom: 3px;
      width: 28px;
      height: 28px;
      font-size: 15px;
      line-height: 28px;
      background: rgba(0, 0, 0, 0.35);
    }
    .album-item .fav-btn.on {
      background: rgba(255, 255, 255, 0.9);
    }

    /* ----- 写真を追加 ----- */
    #adder {
      z-index: 12;
      overflow-y: auto;
      padding: 16px;
      background: var(--bg);
    }
    .add-btns {
      display: flex;
      gap: 8px;
    }
    .camera-btn:disabled,
    .btn-main:disabled {
      opacity: 0.4;
    }
    .add-slots {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-top: 12px;
    }
    .add-slot {
      position: relative;
      width: 100%;
      aspect-ratio: 4 / 3;
      padding: 0;
      border: none;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }
    .add-slot img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .add-slot.empty {
      border: 2px dashed #ccc;
      background: #faf7f2;
      color: #bbb;
      font-size: 1.6em;
    }
    .add-slot .remove {
      position: absolute;
      top: 3px;
      right: 3px;
      width: 26px;
      height: 26px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 14px;
      line-height: 26px;
    }
    .add-slot .new {
      position: absolute;
      left: 3px;
      bottom: 3px;
      padding: 0 5px;
      border-radius: 4px;
      background: var(--green);
      color: #fff;
      font-size: 0.7em;
    }
    .note.warn {
      color: #d33;
    }

    /* ----- 写真を縦に並べる表示 ----- */
    #stack {
      z-index: 11;
      background: #111;
      color: #fff;
    }
    .stack-top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 4px 16px;
    }
    .stack-top h2 {
      margin: 0;
      font-size: 1em;
    }
    #stack-close {
      margin-left: auto;
      padding: 0 12px;
      border: none;
      background: none;
      color: #fff;
      font-size: 1.8em;
    }
    #stack-text {
      padding: 0 16px 6px;
      color: #ddd;
      font-size: 0.9em;
      word-break: break-all;
    }
    .stack-list {
      flex: 1;
      min-height: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding: 0 8px 12px;
    }
    .stack-item {
      position: relative;
      flex: 1;
      min-height: 0;
    }
    .stack-item img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      cursor: pointer;
    }
    .stack-item .cover-btn {
      position: absolute;
      right: 6px;
      bottom: 6px;
      padding: 5px 10px;
      border: 1px solid #aaa;
      border-radius: 14px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 0.8em;
    }
    .stack-item .fav-btn {
      position: absolute;
      left: 6px;
      bottom: 6px;
    }
    .stack-item .fav-btn.on {
      background: #fff;
    }
    .stack-item .cover-btn.is-cover {
      border-color: var(--accent);
      background: var(--accent);
    }

    /* ----- お知らせ ----- */
    #toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 24px;
      z-index: 30;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.92);
      color: #fff;
      font-size: 0.9em;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <!-- ホーム -->
  <section id="page-home" class="page active">
    <h1>食事記録アプリ</h1>
    <div class="filter">
      <select id="f-year" aria-label="年"></select>年
      <select id="f-month" aria-label="月"></select>月
    </div>
    <div id="list"></div>
  </section>

  <!-- カレンダー（1日1枚の写真。タップでその日の編集画面） -->
  <section id="page-calendar" class="page">
    <div class="cal-head">
      <button id="cal-prev" aria-label="前の月">‹</button>
      <h1 id="cal-title"></h1>
      <button id="cal-next" aria-label="次の月">›</button>
    </div>
    <div class="cal-week">
      <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
    </div>
    <div id="cal-grid" class="cal-grid"></div>
    <button id="cal-today" class="backup-btn">今月に戻る</button>
  </section>

  <!-- アルバム -->
  <section id="page-album" class="page">
    <h1>アルバム</h1>
    <div class="album-checks">
      <label><input type="checkbox" data-album-type="diary" checked>日記</label>
      <label><input type="checkbox" data-album-type="breakfast" checked>朝食</label>
      <label><input type="checkbox" data-album-type="lunch" checked>昼食</label>
      <label><input type="checkbox" data-album-type="dinner" checked>夕食</label>
      <label><input type="checkbox" id="al-fav"><span class="heart on">♥</span>お気に入りのみ</label>
    </div>
    <div class="filter">
      <select id="al-year" aria-label="年"></select>年
      <select id="al-month" aria-label="月"></select>月
    </div>
    <p id="al-count" class="summary"></p>
    <div id="album-grid" class="album-grid"></div>
  </section>

  <!-- 設定 -->
  <section id="page-settings" class="page">
    <h1>設定</h1>
    <div class="set-group">
      <div class="set-title">使うカメラ</div>
      <label class="set-radio">
        <input type="radio" name="camera" value="quiet">
        <span>🔇 静音カメラ<small>音なし・横4：縦3</small></span>
      </label>
      <label class="set-radio">
        <input type="radio" name="camera" value="app">
        <span>📷 きれいなカメラ<small>スマホのカメラアプリ・シャッター音あり</small></span>
      </label>
    </div>
    <div class="set-group">
      <div class="set-title">食事の時間帯</div>
      <div class="set-time" data-meal="breakfast">🌅 朝食<span><select class="t-start"></select>時 〜 <select class="t-end"></select>時</span></div>
      <div class="set-time" data-meal="lunch">☀️ 昼食<span><select class="t-start"></select>時 〜 <select class="t-end"></select>時</span></div>
      <div class="set-time" data-meal="dinner">🌙 夕食<span><select class="t-start"></select>時 〜 <select class="t-end"></select>時</span></div>
      <p class="set-note">撮影した時刻から種類を自動で選ぶときに使います。どれにも入らない時刻は「日記」になります。</p>
    </div>
    <div class="set-group">
      <div class="set-title">バックアップ</div>
      <button id="export-btn" class="backup-btn">💾 バックアップを保存</button>
      <label for="import-file" class="backup-btn">📂 バックアップを読み込む</label>
      <p class="set-note">保存したファイル（.mlbk）は「ダウンロード」に入ります。OneDriveアプリでアップロードしておくと、PCのChromeでこのアプリを開いて読み込めます。</p>
    </div>
  </section>

  <nav class="bottom-nav">
    <button data-page="home" class="active"><span>🏠</span>ホーム</button>
    <button data-page="calendar"><span>📅</span>カレンダー</button>
    <button id="nav-add" class="nav-add" aria-label="写真を追加">＋</button>
    <button data-page="album"><span>🖼</span>アルバム</button>
    <button data-page="settings"><span>⚙️</span>設定</button>
  </nav>

  <!-- 写真を受け取るための部品（画面には出さない） -->
  <input type="file" id="camera-input" class="hidden-input" accept="image/*" capture="environment">
  <input type="file" id="gallery-input" class="hidden-input" accept="image/*" multiple>
  <!-- .mlbk は Android が知らない拡張子で、accept で絞ると選べなくなるため、絞らずに中身で判定する -->
  <input type="file" id="import-file" class="hidden-input">

  <!-- 写真を追加（ボトムナビの＋から） -->
  <div id="adder" class="overlay">
    <div class="ed-top">
      <h2>写真を追加</h2>
      <button id="adder-close" aria-label="閉じる">×</button>
    </div>
    <div class="add-btns">
      <button id="adder-camera" class="camera-btn">📷 カメラ起動</button>

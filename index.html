<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食事記録アプリ</title>
  <!-- ZIP ファイルを作る・読むためのライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: #fffaf3;
      color: #333;
    }
    h1 {
      font-size: 1.4em;
    }
    /* 本物の input は隠して、label をボタンに見せる */
    #camera {
      display: none;
    }
    .buttons {
      display: flex;
      gap: 8px;
    }
    .camera-btn {
      flex: 1;
      display: block;
      padding: 16px 8px;
      border: none;
      background: #ff8a3d;
      color: #fff;
      font-family: inherit;
      font-size: 1em;
      font-weight: bold;
      text-align: center;
      border-radius: 12px;
      line-height: 1.4;
    }
    .camera-btn small {
      display: block;
      font-weight: normal;
      font-size: 0.75em;
      opacity: 0.9;
    }
    .camera-btn.quiet {
      background: #4a8f6a;
    }
    #status {
      min-height: 1.5em;
      margin: 8px 0;
      font-size: 0.9em;
      color: #888;
      text-align: center;
    }
    .record {
      background: #fff;
      border-radius: 12px;
      margin-bottom: 16px;
      overflow: hidden;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }
    .record img {
      display: block;
      width: 100%;
    }
    .record-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
    }
    .record-meta {
      font-size: 0.8em;
      color: #888;
    }
    .delete-btn {
      border: none;
      background: none;
      color: #c44;
      font-size: 0.9em;
      padding: 8px;
    }
    .empty {
      text-align: center;
      color: #aaa;
      margin-top: 32px;
    }
    #import-file {
      display: none;
    }
    .backup {
      display: flex;
      gap: 8px;
      margin-bottom: 12px;
    }
    .backup-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: #555;
      font-family: inherit;
      font-size: 0.9em;
      text-align: center;
      border-radius: 8px;
    }

    /* ===== 静音カメラの画面（全画面） ===== */
    #quiet-cam {
      display: none;
      position: fixed;
      inset: 0;
      background: #000;
      z-index: 10;
      flex-direction: column;
    }
    #quiet-cam.open {
      display: flex;
    }
    #quiet-video {
      flex: 1;
      width: 100%;
      min-height: 0;
      object-fit: contain;
    }
    .cam-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 20px 16px 32px;
    }
    .cam-bar button {
      border: none;
      background: none;
      color: #fff;
      font-family: inherit;
      font-size: 1em;
      width: 80px;
    }
    #shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #888;
    }
    #shutter:active {
      background: #ddd;
    }
    /* 音の代わりに、撮った瞬間に画面を白く光らせる */
    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #flash.on {
      opacity: 0.8;
      transition: none;
    }
    #cam-msg {
      position: absolute;
      top: 40%;
      left: 16px;
      right: 16px;
      color: #fff;
      text-align: center;
    }
  </style>
</head>
<body>
  <h1>食事記録アプリ</h1>

  <div class="buttons">
    <label for="camera" class="camera-btn">📷 カメラアプリ<small>きれい・音あり</small></label>
    <button id="open-quiet" class="camera-btn quiet">🔇 静音カメラ<small>音なし</small></button>
  </div>
  <input type="file" id="camera" accept="image/*" capture="environment">

  <div id="status"></div>

  <div class="backup">
    <button id="export-btn" class="backup-btn">💾 バックアップ</button>
    <label for="import-file" class="backup-btn">📂 読み込み</label>
  </div>
  <!-- .mlbk は Android が知らない拡張子で、accept で絞ると選べなくなるため、絞らずに中身で判定する -->
  <input type="file" id="import-file">

  <div id="list"></div>

  <!-- 静音カメラ -->
  <div id="quiet-cam">
    <video id="quiet-video" autoplay playsinline muted></video>
    <div id="cam-msg"></div>
    <div class="cam-bar">
      <button id="cam-cancel">キャンセル</button>
      <button id="shutter" aria-label="撮影"></button>
      <span style="width:80px"></span>
    </div>
    <div id="flash"></div>
  </div>

  <script>
    // ===== IndexedDB の準備 =====
    // データベース名 "meal-log"、その中に "records" という入れ物を作る
    function openDB() {
      return new Promise((resolve, reject) => {
        const req = indexedDB.open('meal-log', 1);
        req.onupgradeneeded = () => {
          // 初回だけ実行される。id は自動で 1, 2, 3… と振られる
          req.result.createObjectStore('records', { keyPath: 'id', autoIncrement: true });
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      });
    }

    // 入れ物に対して1回の操作をする共通関数
    async function withStore(mode, action) {
      const db = await openDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('records', mode);
        const req = action(tx.objectStore('records'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      });
    }

    const addRecord = (record) => withStore('readwrite', (s) => s.add(record));
    const getAllRecords = () => withStore('readonly', (s) => s.getAll());
    const deleteRecord = (id) => withStore('readwrite', (s) => s.delete(id));

    // ===== 写真の縮小 =====
    // 長い辺を 1000px にして JPEG に変換（数MB → 100〜200KB 程度になる）
    // source には写真ファイルでも、静音カメラの映像（video）でも渡せる
    async function resizeImage(source, maxSize = 1000) {
      const bitmap = await createImageBitmap(source);
      const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      return { blob, width: canvas.width, height: canvas.height };
    }

    // ===== 画面 =====
    const camera = document.getElementById('camera');
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('list');
    let shownUrls = [];

    function formatDate(time) {
      const d = new Date(time);
      const week = '日月火水木金土'[d.getDay()];
      const hh = String(d.getHours()).padStart(2, '0');
      const mm = String(d.getMinutes()).padStart(2, '0');
      return `${d.getMonth() + 1}/${d.getDate()}(${week}) ${hh}:${mm}`;
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }

    const sourceLabel = { app: '📷', quiet: '🔇' };

    async function showList() {
      // 前回表示した画像のURLを解放（メモリ節約）
      shownUrls.forEach((url) => URL.revokeObjectURL(url));
      shownUrls = [];

      const records = await getAllRecords();
      records.sort((a, b) => b.createdAt - a.createdAt); // 撮影日時の新しい順

      if (records.length === 0) {
        listEl.innerHTML = '<p class="empty">まだ記録がありません</p>';
        return;
      }

      const total = records.reduce((sum, r) => sum + r.photo.size, 0);
      listEl.innerHTML = `<p class="record-meta">${records.length}件・合計 ${formatSize(total)}</p>`;

      for (const r of records) {
        const url = URL.createObjectURL(r.photo);
        shownUrls.push(url);

        // 以前の記録には width などが無いので、あるものだけ表示する
        const meta = [sourceLabel[r.source], formatSize(r.photo.size)];
        if (r.width) meta.push(`${r.width}×${r.height}`);
        if (r.originalSize) meta.push(`元 ${formatSize(r.originalSize)}`);

        const div = document.createElement('div');
        div.className = 'record';
        div.innerHTML = `
          <img src="${url}" alt="食事の写真">
          <div class="record-info">
            <div>
              <div>${formatDate(r.createdAt)}</div>
              <div class="record-meta">${meta.filter(Boolean).join('・')}</div>
            </div>
            <button class="delete-btn">削除</button>
          </div>`;
        div.querySelector('.delete-btn').addEventListener('click', async () => {
          if (!confirm('この記録を削除しますか？')) return;
          await deleteRecord(r.id);
          showList();
        });
        listEl.appendChild(div);
      }
    }

    // 写真を縮小して保存 → 一覧を更新（どちらのカメラからも使う）
    async function savePhoto(source, sourceType, originalSize) {
      statusEl.textContent = '保存中…';
      try {
        const { blob, width, height } = await resizeImage(source);
        await addRecord({
          createdAt: Date.now(),
          photo: blob,
          width,
          height,
          source: sourceType,
          originalSize,
        });
        statusEl.textContent = `保存しました（${formatSize(blob.size)}）`;
        await showList();
      } catch (e) {
        statusEl.textContent = '保存に失敗しました：' + e.message;
      }
    }

    // ----- 方法1：カメラアプリ -----
    camera.addEventListener('change', async () => {
      const file = camera.files[0];
      if (!file) return;
      await savePhoto(file, 'app', file.size);
      camera.value = ''; // 同じ操作を続けてできるようにリセット
    });

    // ----- 方法2：静音カメラ（カメラ映像の1コマを保存するので音が鳴らない） -----
    const quietCam = document.getElementById('quiet-cam');
    const video = document.getElementById('quiet-video');
    const camMsg = document.getElementById('cam-msg');
    const flash = document.getElementById('flash');
    let stream = null;

    async function openQuietCam() {
      quietCam.classList.add('open');
      camMsg.textContent = 'カメラを起動中…';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: 'environment', // 背面カメラ
            width: { ideal: 1920 },
            height: { ideal: 1920 },
          },
          audio: false,
        });
        video.srcObject = stream;
        camMsg.textContent = '';
      } catch (e) {
        camMsg.textContent = e.name === 'NotAllowedError'
          ? 'カメラの使用が許可されていません。Chromeのアドレスバー左のアイコンから、カメラを「許可」にしてください。'
          : 'カメラを起動できませんでした：' + e.message;
      }
    }

    function closeQuietCam() {
      if (stream) stream.getTracks().forEach((t) => t.stop()); // カメラを止める
      stream = null;
      video.srcObject = null;
      quietCam.classList.remove('open');
    }

    document.getElementById('open-quiet').addEventListener('click', openQuietCam);
    document.getElementById('cam-cancel').addEventListener('click', closeQuietCam);

    document.getElementById('shutter').addEventListener('click', async () => {
      if (!stream || video.readyState < 2) return; // 映像がまだ来ていない
      // 白く光らせて「撮れた」ことを伝える
      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
      const bitmap = await createImageBitmap(video); // 今のコマを確保してからカメラを閉じる
      closeQuietCam();
      await savePhoto(bitmap, 'quiet', null);
    });

    // 静音カメラを開いたまま別のアプリに切り替えたら、カメラを止める
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && stream) closeQuietCam();
    });

    // ===== バックアップ（ZIP） =====
    // ZIP の中身:
    //   records.json … 日時・方式・サイズなどの情報
    //   photos/2026-11-23_1230_5.jpg … 写真そのもの（PCでそのまま開ける）
    // ===== バックアップの暗号化 =====
    // ZIP 全体を AES-GCM で暗号化して .mlbk ファイルにする。
    // パスワードはアプリに埋め込み（このアプリ以外では開けないようにするのが目的）。
    // ※ この文字列を変えると、それ以前のバックアップが読めなくなるので変更しないこと
    const BACKUP_PASSWORD = 'meal-log/7f3c9a1e-backup-key/2026';
    const MAGIC = new TextEncoder().encode('MLBK1'); // ファイルの先頭に付ける目印

    // パスワードと salt（ファイルごとのランダム値）から暗号鍵を作る
    async function deriveKey(salt) {
      const base = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(BACKUP_PASSWORD), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    // ファイルの並び: 目印(5) + salt(16) + iv(12) + 暗号化されたZIP
    async function encryptBackup(zipBlob) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(salt);
      const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, await zipBlob.arrayBuffer());
      return new Blob([MAGIC, salt, iv, data], { type: 'application/octet-stream' });
    }

    function isEncrypted(bytes) {
      return MAGIC.every((b, i) => bytes[i] === b);
    }

    async function decryptBackup(bytes) {
      const salt = bytes.slice(5, 21);
      const iv = bytes.slice(21, 33);
      const key = await deriveKey(salt);
      try {
        return await crypto.subtle.decrypt({ name: 'AES-GCM', iv }, key, bytes.slice(33));
      } catch {
        throw new Error('バックアップを解読できませんでした（ファイルが壊れている可能性があります）');
      }
    }

    const pad = (n) => String(n).padStart(2, '0');
    function stamp(time) {
      const d = new Date(time);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
    }

    document.getElementById('export-btn').addEventListener('click', async () => {
      const records = await getAllRecords();
      if (records.length === 0) {
        statusEl.textContent = 'バックアップする記録がありません';
        return;
      }
      statusEl.textContent = 'バックアップを作成中…';
      try {
        const zip = new JSZip();
        const list = records.map((r) => {
          const file = `photos/${stamp(r.createdAt)}_${r.id}.jpg`;
          zip.file(file, r.photo); // JPEG は圧縮済みなので、そのまま入れる
          const { photo, id, ...info } = r;
          return { ...info, file };
        });
        zip.file('records.json', JSON.stringify({ app: 'meal-log', version: 1, records: list }, null, 2), {
          compression: 'DEFLATE',
        });
        const zipBlob = await zip.generateAsync({ type: 'blob' });
        const blob = await encryptBackup(zipBlob);
        const name = `meal-log-backup_${stamp(Date.now())}.mlbk`;

        // ダウンロードとして保存（誤送信を防ぐため、共有メニューは使わない）
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        statusEl.textContent = `ダウンロードしました（${records.length}件・${formatSize(blob.size)}）`;
      } catch (e) {
        statusEl.textContent = 'バックアップに失敗しました：' + e.message;
      }
    });

    const importFile = document.getElementById('import-file');
    importFile.addEventListener('change', async () => {
      const file = importFile.files[0];
      importFile.value = '';
      if (!file) return;
      statusEl.textContent = '読み込み中…';
      try {
        // 暗号化バックアップ(.mlbk)なら解読、以前の ZIP ならそのまま読む
        const bytes = new Uint8Array(await file.arrayBuffer());
        const zipData = isEncrypted(bytes) ? await decryptBackup(bytes) : bytes;
        let zip;
        try {
          zip = await JSZip.loadAsync(zipData);
        } catch {
          throw new Error('食事記録アプリのバックアップではありません');
        }
        const json = zip.file('records.json');
        if (!json) throw new Error('食事記録アプリのバックアップではありません');
        const data = JSON.parse(await json.async('string'));

        // すでにある記録（同じ撮影日時）は飛ばす → 何度読み込んでも重複しない
        const existing = new Set((await getAllRecords()).map((r) => r.createdAt));
        let added = 0;
        let skipped = 0;
        for (const info of data.records) {
          if (existing.has(info.createdAt)) {
            skipped++;
            continue;
          }
          const photoFile = zip.file(info.file);
          if (!photoFile) {
            skipped++;
            continue;
          }
          const photo = new Blob([await photoFile.async('arraybuffer')], { type: 'image/jpeg' });
          const { file: _, ...rest } = info;
          await addRecord({ ...rest, photo });
          existing.add(info.createdAt);
          added++;
        }
        statusEl.textContent = `読み込みました：追加 ${added}件` + (skipped ? `・重複などで飛ばした ${skipped}件` : '');
        await showList();
      } catch (e) {
        statusEl.textContent = '読み込みに失敗しました：' + e.message;
      }
    });

    showList();
  </script>
</body>
</html>

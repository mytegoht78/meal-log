  <div id="toast"></div>

  <script>
    // =====================================================
    // 共通の部品
    // =====================================================
    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, '0');

    const TYPES = {
      diary: { label: '日記', icon: '📔' },
      breakfast: { label: '朝食', icon: '🌅' },
      lunch: { label: '昼食', icon: '☀️' },
      dinner: { label: '夕食', icon: '🌙' },
    };
    const TYPE_ORDER = ['diary', 'breakfast', 'lunch', 'dinner'];
    const MEMO = 'memo'; // ひとこと（1日1つ。写真なしの文字だけ）
    const SOURCE_ICON = { app: '📷', quiet: '🔇', gallery: '🖼' };
    // 以前の「間食」は「日記」になった
    const normType = (t) => (t === 'snack' ? 'diary' : t);
    const MAX_PHOTOS = 3; // 日記・食事ごとの写真の上限

    // 使うカメラ（設定画面で選ぶ。スマホに記憶。最初は静音）
    function getCameraSetting() {
      try {
        return localStorage.getItem('meal-log-camera') === 'app' ? 'app' : 'quiet';
      } catch {
        return 'quiet';
      }
    }
    function setCameraSetting(value) {
      try {
        localStorage.setItem('meal-log-camera', value);
      } catch {
        // 保存できなくても、今回は選んだ方で動く
      }
      cameraSetting = value;
    }
    let cameraSetting = getCameraSetting();

    // 上限を超えた写真を減らす（代表は残し、ほかは古い順に残す。並び順は保つ）
    function trimSlot(slot) {
      if (slot.photos.length <= MAX_PHOTOS) return slot;
      const cover = slot.photos.find((p) => p.id === slot.cover);
      const others = slot.photos.filter((p) => p !== cover).slice(0, MAX_PHOTOS - (cover ? 1 : 0));
      return { ...slot, photos: slot.photos.filter((p) => p === cover || others.includes(p)) };
    }

    // 食事の時間帯（設定画面で変えられる。[開始時, 終了時)。スマホに記憶）
    const MEALS = ['breakfast', 'lunch', 'dinner'];
    const DEFAULT_TIMES = { breakfast: [5, 10], lunch: [10, 15], dinner: [17, 23] };
    function loadMealTimes() {
      try {
        const t = JSON.parse(localStorage.getItem('meal-log-times'));
        if (t && MEALS.every((k) => Array.isArray(t[k]) && t[k].length === 2)) return t;
      } catch {
        // 読めなければ初期値
      }
      return JSON.parse(JSON.stringify(DEFAULT_TIMES));
    }
    let mealTimes = loadMealTimes();

    // 時刻から種類を決める（どの時間帯にも入らなければ日記）
    function typeByTime(time) {
      const h = new Date(time).getHours();
      for (const k of MEALS) {
        const [start, end] = mealTimes[k];
        if (h >= start && h < end) return k;
      }
      return 'diary';
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }
    // 日付は "2026-11-24" の文字列で扱う
    function dayKey(time) {
      const d = new Date(time);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function parseDay(day) {
      const [y, m, d] = day.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function formatDay(day) {
      const d = parseDay(day);
      return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`;
    }
    function formatDateTime(time) {
      const d = new Date(time);
      return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`;
    }
    function stamp(time) {
      const d = new Date(time);
      return `${dayKey(time)}_${pad(d.getHours())}${pad(d.getMinutes())}`;
    }
    const slotKey = (day, type) => `${day}_${type}`;
    const newId = () => crypto.randomUUID();

    let toastTimer;
    function toast(message, ms = 2500) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      if (ms) toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    }

    // 写真の表示用URL（同じ写真には同じURLを使い回し、不要になったら解放）
    function makeUrlCache() {
      const map = new Map();
      return {
        get(blob) {
          if (!map.has(blob)) map.set(blob, URL.createObjectURL(blob));
          return map.get(blob);
        },
        clear() {
          map.forEach((url) => URL.revokeObjectURL(url));
          map.clear();
        },
      };
    }

    // =====================================================
    // データベース（IndexedDB）
    // 1件 = ある日のある種類（例：11月24日の昼食）。1日に各種類1件まで
    //   { key: "2026-11-24_lunch", day, type, cover: 代表写真のid, text: 料理名・メモ,
    //     photos: [{ id, blob, width, height, source, originalSize, takenAt, addedAt }] }
    // type は diary / breakfast / lunch / dinner と、ひとことの memo（写真なし）
    // =====================================================

    // 以前の形式からの変換。写真の id は作り方を固定して、
    // 古いバックアップを読み込んでも同じ写真が二重に入らないようにする
    function fromV1Record(r, blob) {
      return {
        day: dayKey(r.createdAt),
        type: typeByTime(r.createdAt),
        photos: [{
          id: `legacy-${r.createdAt}-0`, blob, width: r.width, height: r.height,
          source: r.source, originalSize: r.originalSize, takenAt: r.createdAt, addedAt: r.createdAt,
        }],
      };
    }
    function fromV2Meal(m) {
      return {
        day: dayKey(m.eatenAt),
        type: normType(m.type),
        photos: m.photos.map((p, i) => ({
          ...p, id: `legacy-${m.createdAt}-${i}`, takenAt: m.eatenAt, addedAt: m.createdAt + i,
        })),
      };
    }

    let dbPromise = null;
    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('meal-log', 5);
          req.onupgradeneeded = () => {
            const db = req.result;
            const tx = req.transaction;
            const hadSlots = db.objectStoreNames.contains('slots');
            const slots = hadSlots
              ? tx.objectStore('slots')
              : db.createObjectStore('slots', { keyPath: 'key' });

            // 以前の形式のデータを集めて、同じ日・同じ種類は1つにまとめる
            const merged = new Map();
            const mergeIn = (part) => {
              const key = slotKey(part.day, part.type);
              if (!merged.has(key)) merged.set(key, { key, day: part.day, type: part.type, photos: [] });
              merged.get(key).photos.push(...part.photos);
            };
            const readOld = (name, convert, next) => {
              if (!db.objectStoreNames.contains(name)) return next();
              tx.objectStore(name).openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                  mergeIn(convert(cursor.value));
                  cursor.continue();
                } else {
                  db.deleteObjectStore(name);
                  next();
                }
              };
            };
            readOld('records', (r) => fromV1Record(r, r.photo), () =>
              readOld('meals', fromV2Meal, () => {
                merged.forEach((s) => {
                  s.photos.sort((a, b) => a.addedAt - b.addedAt);
                  s.cover = s.photos[0].id; // 一番最初に登録した写真を代表に
                  s.text = '';
                  slots.put(trimSlot(s));
                });
                // 第3版の「間食」を「日記」に付け替え、4枚目以降の写真を減らす
                if (hadSlots) {
                  slots.openCursor().onsuccess = (e) => {
                    const cursor = e.target.result;
                    if (!cursor) return;
                    const s = cursor.value;
                    const fixed = trimSlot(s);
                    if (s.type === 'snack') {
                      cursor.delete();
                      slots.put({ ...fixed, type: 'diary', key: slotKey(s.day, 'diary') });
                    } else if (fixed !== s) {
                      cursor.update(fixed);
                    }
                    cursor.continue();
                  };
                }
              }));
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return dbPromise;
    }

    async function withStore(mode, action) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('slots', mode);
        const req = action(tx.objectStore('slots'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      });
    }
    const getAllSlots = () => withStore('readonly', (s) => s.getAll());
    const getSlot = (key) => withStore('readonly', (s) => s.get(key));
    const getDaySlots = (day) => withStore('readonly', (s) => s.getAll(IDBKeyRange.bound(day + '_', day + '_￿')));
    const putSlot = (slot) => withStore('readwrite', (s) => s.put(slot));
    const deleteSlot = (key) => withStore('readwrite', (s) => s.delete(key));

    // 書き換えは1つずつ順番に行う（文字の保存と★が同時に起きても、片方が消えないように）
    let writeChain = Promise.resolve();
    function serial(fn) {
      const p = writeChain.then(fn);
      writeChain = p.catch(() => {});
      return p;
    }
    const emptySlot = (day, type) => ({ key: slotKey(day, type), day, type, photos: [], cover: null, text: '' });

    // 保存。写真も文字もなくなったら消す。代表が無効なら先頭の写真を代表に
    async function saveOrDelete(slot) {
      if (slot.photos.length === 0 && !slot.text) return deleteSlot(slot.key);
      if (!slot.photos.some((p) => p.id === slot.cover)) slot.cover = slot.photos[0]?.id ?? null;
      return putSlot(slot);
    }

    // 上限（3枚）までだけ追加する。追加できた枚数を返す
    async function rawAddPhotos(day, type, photos, preferredCover) {
      const slot = (await getSlot(slotKey(day, type))) || emptySlot(day, type);
      const isNew = slot.photos.length === 0;
      const fit = photos.slice(0, Math.max(0, MAX_PHOTOS - slot.photos.length));
      if (fit.length === 0) return 0;
      slot.photos.push(...fit);
      if (isNew && preferredCover && fit.some((p) => p.id === preferredCover)) slot.cover = preferredCover;
      await saveOrDelete(slot);
      return fit.length;
    }
    async function rawTakePhoto(key, photoId) {
      const slot = await getSlot(key);
      const i = slot.photos.findIndex((p) => p.id === photoId);
      const [photo] = slot.photos.splice(i, 1);
      await saveOrDelete(slot);
      return { photo, slot };
    }

    // 写真を、ある日のある種類に追加（なければ作る。最初の写真が代表）
    const addPhotosToSlot = (day, type, photos, preferredCover) =>
      serial(() => rawAddPhotos(day, type, photos, preferredCover));
    // 写真を1枚取り外す（代表だったら次の写真が代表に）
    const takePhoto = (key, photoId) => serial(() => rawTakePhoto(key, photoId));
    // 移動先が3枚で埋まっていたら移動しない（false を返す）
    const movePhoto = (key, photoId, toType) => serial(async () => {
      const from = await getSlot(key);
      const to = await getSlot(slotKey(from.day, toType));
      if ((to?.photos.length || 0) >= MAX_PHOTOS) return false;
      const { photo, slot } = await rawTakePhoto(key, photoId);
      await rawAddPhotos(slot.day, toType, [photo]);
      return true;
    });
    // 「写真を追加」画面の保存：外した写真を除き、新しい写真を足し、文字を変える
    const commitSlot = (day, type, removedIds, added, text) => serial(async () => {
      const slot = (await getSlot(slotKey(day, type))) || emptySlot(day, type);
      slot.photos = slot.photos.filter((p) => !removedIds.has(p.id));
      const fit = added.slice(0, Math.max(0, MAX_PHOTOS - slot.photos.length));
      slot.photos.push(...fit);
      if (text !== null) slot.text = text;
      await saveOrDelete(slot);
      return fit.length;
    });
    const setCover = (key, photoId) => serial(async () => {
      const slot = await getSlot(key);
      if (!slot) return;
      slot.cover = photoId;
      await putSlot(slot);
    });
    // お気に入りの付け外し。変更後の状態（true/false）を返す
    const toggleFav = (key, photoId) => serial(async () => {
      const slot = await getSlot(key);
      const p = slot?.photos.find((x) => x.id === photoId);
      if (!p) return false;
      p.fav = !p.fav;
      await putSlot(slot);
      return p.fav;
    });
    // 画面上の写真データにも反映して、♡のボタンを描き直す
    async function flipFav(key, photo, button) {
      photo.fav = await toggleFav(key, photo.id);
      if (button) setFavButton(button, photo.fav);
      toast(photo.fav ? 'お気に入りにしました' : 'お気に入りを外しました', 1500);
      refreshAll();
    }
    function setFavButton(button, on) {
      button.textContent = on ? '♥' : '♡';
      button.classList.toggle('on', !!on);
      button.setAttribute('aria-label', on ? 'お気に入りを外す' : 'お気に入りにする');
    }

    // 文字を保存。onlyIfEmpty のときは、すでに文字があれば変えない。変えたら true
    const setSlotText = (day, type, text, onlyIfEmpty = false) => serial(async () => {
      const slot = (await getSlot(slotKey(day, type))) || emptySlot(day, type);
      if (onlyIfEmpty && slot.text) return false;
      if ((slot.text || '') === text) return false;
      slot.text = text;
      await saveOrDelete(slot);
      return true;
    });

    // =====================================================
    // 重ねて表示する画面の管理
    // Android の「戻る」で、アプリを抜けずに一番上の画面だけ閉じるようにする
    // =====================================================
    const layers = [];
    let closeWaiters = [];
    function openLayer(el, { onClose, beforeClose } = {}) {
      el.classList.add('open');
      layers.push({ el, onClose, beforeClose });
      history.pushState({ layer: layers.length }, '');
    }
    // 一番上の画面を閉じる。閉じ終わったら完了する（続けて別の画面を開くときは await する）
    function closeLayer() {
      return new Promise((resolve) => {
        closeWaiters.push(resolve);
        history.back(); // → popstate で実際に閉じる
      });
    }
    function topLayer() {
      return layers[layers.length - 1]?.el;
    }
    window.addEventListener('popstate', () => {
      const top = layers[layers.length - 1];
      const waiters = closeWaiters;
      closeWaiters = [];
      if (top) {
        if (top.beforeClose && !top.beforeClose()) {
          history.pushState({ layer: layers.length }, ''); // 閉じるのをやめた
        } else {
          layers.pop();
          top.el.classList.remove('open');
          if (top.onClose) top.onClose();
        }
      }
      waiters.forEach((resolve) => resolve());
    });
    // シートの外側（暗い部分）をタップしたら閉じる
    document.querySelectorAll('.sheet-overlay').forEach((el) => {
      el.addEventListener('click', (e) => {
        if (e.target === el) closeLayer();
      });
    });

    // =====================================================
    // 写真の取り込み
    // =====================================================
    // 長い辺を 1000px にして JPEG に変換（数MB → 100〜200KB 程度になる）
    async function resizeImage(source, maxSize = 1000) {
      const bitmap = await createImageBitmap(source);
      const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      return { blob, width: canvas.width, height: canvas.height };
    }

    // JPEG の中に記録された撮影日時（EXIF）を読む。読めなければ null
    async function readExifDate(file) {
      try {
        const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
        if (v.getUint16(0) !== 0xffd8) return null; // JPEG ではない
        let off = 2;
        while (off + 10 < v.byteLength) {
          const marker = v.getUint16(off);
          if ((marker & 0xff00) !== 0xff00) break;
          if (marker === 0xffe1 && v.getUint32(off + 4) === 0x45786966) { // "Exif"
            const t = off + 10; // ここから TIFF 形式
            const le = v.getUint16(t) === 0x4949;
            const u16 = (p) => v.getUint16(p, le);
            const u32 = (p) => v.getUint32(p, le);
            const find = (ifd, tag) => {
              const n = u16(ifd);
              for (let i = 0; i < n; i++) if (u16(ifd + 2 + i * 12) === tag) return ifd + 2 + i * 12;
              return null;
            };
            const ifd0 = t + u32(t + 4);
            let entry = null;
            const exifIfd = find(ifd0, 0x8769);
            if (exifIfd) entry = find(t + u32(exifIfd + 8), 0x9003); // 撮影日時
            if (!entry) entry = find(ifd0, 0x0132); // 更新日時
            if (!entry) return null;
            let s = '';
            for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(t + u32(entry + 8) + i));
            const m = s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
            if (!m) return null;
            return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
          }
          off += 2 + v.getUint16(off + 2);
        }
      } catch {
        // 読めない形式は気にしない
      }
      return null;
    }

    async function makePhoto(source, sourceType, originalSize, takenAt) {
      const { blob, width, height } = await resizeImage(source);
      return { id: newId(), blob, width, height, source: sourceType, originalSize, takenAt, addedAt: Date.now() };
    }

    // 追加先（「なし」や「＋追加」から来たときだけ決まっている）
    let addTarget = null;

    // 撮った・選んだ写真の行き先：「なし」等から来たらその枠へ直接、そうでなければ「写真を追加」画面へ
    async function receivePhotos(photos) {
      if (addTarget) {
        const { day, type } = addTarget;
        addTarget = null;
        const n = await addPhotosToSlot(day, type, photos);
        const where = `${formatDay(day)}の${TYPES[type].label}`;
        if (n === photos.length) toast(`${where}に追加しました`);
        else if (n > 0) toast(`${MAX_PHOTOS}枚までなので、${n}枚だけ追加しました`, 4000);
        else toast(`${where}は${MAX_PHOTOS}枚まで登録済みです`, 4000);
        refreshAll();
      } else if (adder) {
        addToAdder(photos);
      }
    }

    async function handleFiles(files, sourceType) {
      if (files.length === 0) return;
      toast('写真を読み込み中…', 0);
      try {
        const photos = [];
        for (const f of files) {
          const takenAt = sourceType === 'gallery' ? (await readExifDate(f)) ?? f.lastModified : Date.now();
          photos.push(await makePhoto(f, sourceType, f.size, takenAt));
        }
        toast('', 1);
        await receivePhotos(photos);
      } catch (e) {
        toast('写真を読み込めませんでした：' + e.message, 5000);
      }
    }

    const cameraInput = $('camera-input');
    const galleryInput = $('gallery-input');
    cameraInput.addEventListener('change', async () => {
      await handleFiles([...cameraInput.files], 'app');
      cameraInput.value = '';
    });
    galleryInput.addEventListener('change', async () => {
      await handleFiles([...galleryInput.files], 'gallery');
      galleryInput.value = '';
    });

    // 設定で選んだカメラを起動（カメラアプリの方はタップの直後に呼ぶ必要がある）
    function startCamera() {
      if (cameraSetting === 'app') cameraInput.click();
      else openQuietCam();
    }

    // 追加方法の選択（「なし」のマスや、編集画面の「＋追加」から）
    function openChooser(day, type) {
      addTarget = { day, type };
      $('chooser-title').textContent = `${formatDay(day)}の${TYPES[type].label}に追加`;
      openLayer($('chooser'));
    }
    document.querySelectorAll('[data-choose]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const how = btn.dataset.choose;
        if (how === 'text') {
          const { day, type } = addTarget;
          addTarget = null;
          await closeLayer();
          openTextEditor(day, type);
        } else if (how === 'camera' && cameraSetting === 'quiet') {
          await closeLayer();
          openQuietCam();
        } else {
          // ファイル選択はタップの直後に呼ぶ必要があるので先に開く
          if (how === 'camera') cameraInput.click();
          else galleryInput.click();
          closeLayer();
        }
      });
    });
    $('chooser-cancel').addEventListener('click', () => {
      addTarget = null;
      closeLayer();
    });

    // =====================================================
    // 文字の入力（文字だけの記録・ひとこと）
    // =====================================================
    let textSave = null;
    function openTextSheet(title, value, placeholder, onSave) {
      $('text-title').textContent = title;
      const input = $('text-input');
      input.value = value;
      input.placeholder = placeholder;
      textSave = onSave;
      openLayer($('text-sheet'), { onClose: () => (textSave = null) });
      setTimeout(() => input.focus(), 50);
    }
    async function saveTextSheet() {
      const save = textSave;
      if (!save) return;
      const value = $('text-input').value.trim();
      await closeLayer();
      await save(value);
    }
    $('text-save').addEventListener('click', saveTextSheet);
    $('text-input').addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.isComposing) saveTextSheet();
    });
    $('text-cancel').addEventListener('click', closeLayer);

    // ある日のある種類（またはひとこと）の文字を書く・直す
    async function openTextEditor(day, type) {
      const slot = await getSlot(slotKey(day, type));
      const isMemo = type === MEMO;
      openTextSheet(
        `${formatDay(day)}の${isMemo ? 'ひとこと' : TYPES[type].label}`,
        slot?.text || '',
        isMemo ? '例：公園に遊びに行った' : '例：たまごかけご飯',
        async (text) => {
          await setSlotText(day, type, text);
          refreshAll();
        });
    }

    // =====================================================
    // 静音カメラ（カメラ映像の1コマを保存するので音が鳴らない）
    // =====================================================
    const video = $('quiet-video');
    const camMsg = $('cam-msg');
    let stream = null;

    function stopStream() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
    }

    async function openQuietCam() {
      openLayer($('quiet-cam'), { onClose: stopStream });
      camMsg.textContent = 'カメラを起動中…';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1920 } },
          audio: false,
        });
        if (topLayer() !== $('quiet-cam')) return stopStream(); // 起動中に閉じられた
        video.srcObject = stream;
        camMsg.textContent = '';
      } catch (e) {
        camMsg.textContent = e.name === 'NotAllowedError'
          ? 'カメラの使用が許可されていません。Chromeのアドレスバー左のアイコンから、カメラを「許可」にしてください。'
          : 'カメラを起動できませんでした：' + e.message;
      }
    }

    $('cam-cancel').addEventListener('click', closeLayer);

    $('shutter').addEventListener('click', async () => {
      if (!stream || video.readyState < 2) return; // 映像がまだ来ていない
      const flash = $('flash');
      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
      // 今のコマの中央を 横4：縦3 で切り出して確保してから閉じる（枠に見えていた範囲と同じ）
      const vw = video.videoWidth;
      const vh = video.videoHeight;
      let sw = vw;
      let sh = Math.round((vw * 3) / 4);
      if (sh > vh) {
        sh = vh;
        sw = Math.round((vh * 4) / 3);
      }
      const bitmap = await createImageBitmap(video, Math.round((vw - sw) / 2), Math.round((vh - sh) / 2), sw, sh);
      await closeLayer();
      try {
        await receivePhotos([await makePhoto(bitmap, 'quiet', null, Date.now())]);
      } catch (e) {
        toast('写真を保存できませんでした：' + e.message, 5000);
      }
    });

    // 静音カメラを開いたまま別のアプリに切り替えたら、カメラを止める
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && topLayer() === $('quiet-cam')) closeLayer();
    });

    // =====================================================
    // 「写真を追加」画面（ボトムナビの＋から）
    // 写真1〜3には、選んでいる日・種類の保存済みの写真と、新しく撮った写真を並べる。
    // 保存済みの写真も×で外せる（保存を押したときに確定）
    // =====================================================
    let adder = null; // { day, type, existing, removed:Set(id), added:[写真], textEdited, picked, done }
    const adderUrls = makeUrlCache();

    function openAdder() {
      const now = Date.now();
      addTarget = null;
      adder = {
        day: dayKey(now), type: typeByTime(now), existing: [], removed: new Set(), added: [],
        textEdited: false, picked: false, done: false,
      };
      $('adder-text').value = '';
      openLayer($('adder'), {
        beforeClose: () => adder.done || !isAdderDirty() || confirm('保存せずに閉じますか？'),
        onClose: () => {
          adder = null;
          adderUrls.clear();
        },
      });
      $('adder').scrollTop = 0;
      renderAdder();
      loadAdderSlot();
    }

    const isAdderDirty = () => adder.added.length > 0 || adder.removed.size > 0 || adder.textEdited;
    const adderShown = () => [...adder.existing.filter((p) => !adder.removed.has(p.id)), ...adder.added];

    // 選んでいる日・種類の保存済みの写真と文字を読み込む
    async function loadAdderSlot() {
      const { day, type } = adder;
      const slot = await getSlot(slotKey(day, type));
      if (!adder || adder.day !== day || adder.type !== type) return; // 途中で変わった
      adder.existing = slot?.photos || [];
      adder.removed = new Set();
      if (!adder.textEdited) $('adder-text').value = slot?.text || '';
      renderAdder();
    }

    function renderAdder() {
      const shown = adderShown();
      const box = $('adder-slots');
      box.innerHTML = '';
      for (let i = 0; i < Math.max(MAX_PHOTOS, shown.length); i++) {
        const p = shown[i];
        if (!p) {
          // 空き枠：タップでカメラ起動
          const b = document.createElement('button');
          b.className = 'add-slot empty';
          b.textContent = '＋';
          b.setAttribute('aria-label', `写真${i + 1}をカメラで撮る`);
          b.addEventListener('click', startCamera);
          box.appendChild(b);
          continue;
        }
        const isNew = adder.added.includes(p);
        const div = document.createElement('div');
        div.className = 'add-slot';
        div.innerHTML = `<img alt="写真${i + 1}"><button class="remove" aria-label="外す">×</button>` +
          (isNew ? '<span class="new">追加</span>' : '');
        div.querySelector('img').src = adderUrls.get(p.blob);
        div.querySelector('img').addEventListener('click', () => openViewer(shown, i, null));
        div.querySelector('.remove').addEventListener('click', () => {
          if (isNew) adder.added = adder.added.filter((x) => x !== p);
          else adder.removed.add(p.id);
          renderAdder();
        });
        box.appendChild(div);
      }

      const over = shown.length > MAX_PHOTOS;
      $('adder-camera').disabled = shown.length >= MAX_PHOTOS;
      $('adder-gallery').disabled = shown.length >= MAX_PHOTOS;
      $('adder-save').disabled = over;
      const note = $('adder-note');
      note.classList.toggle('warn', over);
      note.textContent = over
        ? `${MAX_PHOTOS}枚までです。×で${shown.length - MAX_PHOTOS}枚減らしてください`
        : adder.existing.length
          ? `この日の${TYPES[adder.type].label}に保存済みの写真も並んでいます`
          : '';

      $('adder-date').value = adder.day;
      const types = $('adder-types');
      types.innerHTML = '';
      for (const key of TYPE_ORDER) {
        const b = document.createElement('button');
        b.className = 'type-btn' + (adder.type === key ? ' selected' : '');
        b.textContent = `${TYPES[key].icon} ${TYPES[key].label}`;
        b.addEventListener('click', () => {
          adder.picked = true;
          adder.type = key;
          renderAdder();
          loadAdderSlot();
        });
        types.appendChild(b);
      }
    }

    // 撮った・選んだ写真を空き枠に入れる
    function addToAdder(photos) {
      const fit = photos.slice(0, Math.max(0, MAX_PHOTOS - adderShown().length));
      if (fit.length < photos.length) toast(`${MAX_PHOTOS}枚までなので、${fit.length}枚だけ追加しました`, 4000);
      if (fit.length === 0) return;
      // ギャラリーの写真で、日付・種類をまだ触っていなければ、撮影日時に合わせる
      const auto = !adder.picked && adder.added.length === 0 && fit[0].source === 'gallery';
      adder.added.push(...fit);
      if (auto) {
        const first = Math.min(...fit.map((p) => p.takenAt));
        if (dayKey(first) !== adder.day || typeByTime(first) !== adder.type) {
          adder.day = dayKey(first);
          adder.type = typeByTime(first);
          loadAdderSlot();
        }
      }
      renderAdder();
    }

    $('adder-camera').addEventListener('click', startCamera);
    $('adder-gallery').addEventListener('click', () => galleryInput.click());
    $('adder-date').addEventListener('change', () => {
      if (!$('adder-date').value) return;
      adder.picked = true;
      adder.day = $('adder-date').value;
      renderAdder();
      loadAdderSlot();
    });
    $('adder-text').addEventListener('input', () => {
      if (adder) adder.textEdited = true;
    });
    $('adder-close').addEventListener('click', closeLayer);
    $('adder-cancel').addEventListener('click', closeLayer);
    $('adder-save').addEventListener('click', async () => {
      if (!adder || adderShown().length > MAX_PHOTOS) return;
      const { day, type, removed, added, textEdited } = adder;
      const text = textEdited ? $('adder-text').value.trim() : null;
      if (added.length === 0 && removed.size === 0 && text === null) {
        toast('写真を撮るか、文字を入れてください');
        return;
      }
      try {
        await commitSlot(day, type, removed, added, text);
        adder.done = true;
        closeLayer();
        toast(`${formatDay(day)}の${TYPES[type].label}に保存しました`);
        refreshAll();
      } catch (e) {
        toast('保存に失敗しました：' + e.message, 5000);
      }
    });

    // =====================================================
    // 日の編集画面（代表の変更・写真の削除・種類の移動・追加）
    // =====================================================
    let editingDay = null;
    const editorUrls = makeUrlCache();

    function openDayEditor(day) {
      editingDay = day;
      $('ed-title').textContent = formatDay(day);
      renderDayEditor();
      openLayer($('day-editor'), {
        onClose: () => {
          editingDay = null;
          editorUrls.clear();
        },
      });
      $('day-editor').scrollTop = 0; // 表示してからでないと効かない
    }

    async function renderDayEditor() {
      if (!editingDay) return;
      const day = editingDay;
      const slots = await getDaySlots(day);
      if (editingDay !== day) return;
      editorUrls.clear();
      const body = $('ed-body');
      body.innerHTML = '';

      for (const type of TYPE_ORDER) {
        const slot = slots.find((s) => s.type === type);
        const sec = document.createElement('section');
        sec.className = 'ed-sec';
        const count = slot?.photos.length || 0;
        sec.innerHTML = `
          <div class="ed-head">${TYPES[type].icon} ${TYPES[type].label}
            ${count < MAX_PHOTOS ? '<button class="ed-add">＋追加</button>' : ''}
          </div>`;
        sec.querySelector('.ed-add')?.addEventListener('click', () => openChooser(day, type));

        if (!slot?.photos.length) {
          sec.insertAdjacentHTML('beforeend', '<div class="ed-none">写真なし</div>');
        } else {
          const grid = document.createElement('div');
          grid.className = 'ed-photos';
          slot.photos.forEach((p, i) => {
            const isCover = p.id === slot.cover;
            const div = document.createElement('div');
            div.className = 'ed-photo' + (isCover ? ' cover' : '');
            div.innerHTML = `
              <img alt="写真${i + 1}">
              <button class="star" aria-label="代表にする">${isCover ? '★' : '☆'}</button>
              <button class="remove" aria-label="削除">×</button>
              <button class="fav-btn ed-fav"></button>
              <select aria-label="種類を移動">
                ${TYPE_ORDER.map((t) => {
                  if (t === type) return `<option value="${t}" selected>${TYPES[t].label}</option>`;
                  const full = (slots.find((s) => s.type === t)?.photos.length || 0) >= MAX_PHOTOS;
                  return `<option value="${t}"${full ? ' disabled' : ''}>${TYPES[t].label}${full ? '（3枚）' : 'へ移動'}</option>`;
                }).join('')}
              </select>`;
            const fav = div.querySelector('.ed-fav');
            setFavButton(fav, p.fav);
            fav.addEventListener('click', () => flipFav(slot.key, p, fav));
            div.querySelector('img').src = editorUrls.get(p.blob);
            div.querySelector('img').addEventListener('click', () => openViewer(slot.photos, i, slot.key));
            div.querySelector('.star').addEventListener('click', async () => {
              await setCover(slot.key, p.id);
              refreshAll();
            });
            div.querySelector('.remove').addEventListener('click', async () => {
              if (!confirm('この写真を削除しますか？')) return;
              await takePhoto(slot.key, p.id);
              toast('削除しました');
              refreshAll();
            });
            div.querySelector('select').addEventListener('change', async (e) => {
              const moved = await movePhoto(slot.key, p.id, e.target.value);
              toast(moved
                ? `${TYPES[e.target.value].label}へ移動しました`
                : `${TYPES[e.target.value].label}は${MAX_PHOTOS}枚まで登録済みです`);
              refreshAll();
            });
            grid.appendChild(div);
          });
          sec.appendChild(grid);
        }
        sec.appendChild(makeTextInput(day, type, slot?.text, type === 'diary' ? 'メモ' : '料理名・メモ'));
        body.appendChild(sec);
      }

      // ひとこと
      const memo = slots.find((s) => s.type === MEMO);
      const sec = document.createElement('section');
      sec.className = 'ed-sec';
      sec.innerHTML = '<div class="ed-head">💬 ひとこと</div>';
      sec.appendChild(makeTextInput(day, MEMO, memo?.text, '例：公園に遊びに行った'));
      body.appendChild(sec);
    }

    // 編集画面の文字欄（入力を終えたら保存。編集画面は描き直さない）
    function makeTextInput(day, type, value, placeholder) {
      const input = document.createElement('input');
      input.type = 'text';
      input.className = 'ed-text';
      input.maxLength = 200;
      input.enterKeyHint = 'done';
      input.placeholder = placeholder;
      input.value = value || '';
      input.addEventListener('change', async () => {
        if (await setSlotText(day, type, input.value.trim())) showList();
      });
      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.isComposing) input.blur();
      });
      return input;
    }

    $('ed-close').addEventListener('click', closeLayer);

    // =====================================================
    // 写真の拡大表示
    // =====================================================
    let viewerPhotos = [];
    let viewerIndex = 0;
    let viewerKeys = []; // 写真ごとの記録のkey（保存前の写真は null。代表・お気に入りは保存済みだけ）
    let viewerSlots = new Map(); // key → { cover, count, text, day, type }
    let viewerFromAlbum = false;
    let viewerUrl = null;

    // key は1つ（同じ記録の写真）か、写真ごとの配列（アルバム）
    async function openViewer(photos, index, key) {
      viewerPhotos = photos;
      viewerIndex = index;
      viewerFromAlbum = Array.isArray(key);
      viewerKeys = viewerFromAlbum ? key : photos.map(() => key);
      viewerSlots = new Map();
      for (const k of new Set(viewerKeys)) {
        const s = k ? await getSlot(k) : null;
        if (s) viewerSlots.set(k, { cover: s.cover, count: s.photos.length, text: s.text || '', day: s.day, type: s.type });
      }
      renderViewer();
      openLayer($('viewer'), {
        onClose: () => {
          URL.revokeObjectURL(viewerUrl);
          viewerUrl = null;
        },
      });
    }

    function renderViewer() {
      const p = viewerPhotos[viewerIndex];
      if (viewerUrl) URL.revokeObjectURL(viewerUrl);
      viewerUrl = URL.createObjectURL(p.blob);
      $('viewer-img').src = viewerUrl;
      const many = viewerPhotos.length > 1;
      $('viewer-count').textContent = many ? `${viewerIndex + 1} / ${viewerPhotos.length}` : '';
      $('viewer-prev').style.display = many ? '' : 'none';
      $('viewer-next').style.display = many ? '' : 'none';

      const slot = viewerSlots.get(viewerKeys[viewerIndex]);
      const coverBtn = $('viewer-cover');
      coverBtn.style.display = slot && slot.count > 1 ? '' : 'none';
      const isCover = slot && p.id === slot.cover;
      coverBtn.textContent = isCover ? '★ 代表写真' : '☆ 代表にする';
      coverBtn.classList.toggle('is-cover', !!isCover);
      $('viewer-fav').style.display = slot ? '' : 'none';
      setFavButton($('viewer-fav'), p.fav);
      // アルバムから開いたときは、どの日の何の写真かも出す
      const where = viewerFromAlbum && slot ? `${formatDay(slot.day)} ${TYPES[slot.type].label}` : '';
      $('viewer-text').textContent = [where, slot?.text].filter(Boolean).join('　');

      const info = [p.takenAt ? formatDateTime(p.takenAt) : '', SOURCE_ICON[p.source], formatSize(p.blob.size)];
      if (p.width) info.push(`${p.width}×${p.height}`);
      if (p.originalSize) info.push(`元 ${formatSize(p.originalSize)}`);
      $('viewer-info').textContent = info.filter(Boolean).join('・');
    }

    function moveViewer(step) {
      const n = viewerPhotos.length;
      if (n < 2) return;
      viewerIndex = (viewerIndex + step + n) % n;
      renderViewer();
    }

    $('viewer-cover').addEventListener('click', async () => {
      const p = viewerPhotos[viewerIndex];
      const key = viewerKeys[viewerIndex];
      const slot = viewerSlots.get(key);
      if (!slot || p.id === slot.cover) return;
      await setCover(key, p.id);
      slot.cover = p.id;
      renderViewer();
      toast('代表写真にしました');
      refreshAll();
    });
    $('viewer-fav').addEventListener('click', () => {
      const key = viewerKeys[viewerIndex];
      if (key) flipFav(key, viewerPhotos[viewerIndex], $('viewer-fav'));
    });
    $('viewer-close').addEventListener('click', closeLayer);
    $('viewer-prev').addEventListener('click', () => moveViewer(-1));
    $('viewer-next').addEventListener('click', () => moveViewer(1));

    // 左右にスワイプで切り替え
    let touchX = null;
    $('viewer').addEventListener('touchstart', (e) => (touchX = e.touches[0].clientX), { passive: true });
    $('viewer').addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) moveViewer(dx < 0 ? 1 : -1);
    });

    // PC ではキーボードでも操作できる
    document.addEventListener('keydown', (e) => {
      if (topLayer() !== $('viewer')) return;
      if (e.key === 'ArrowLeft') moveViewer(-1);
      if (e.key === 'ArrowRight') moveViewer(1);
      if (e.key === 'Escape') closeLayer();
    });

    // =====================================================
    // 一覧（1日 = 日記・朝食・昼食・夕食の4マス＋ひとこと）
    // =====================================================
    const listUrls = makeUrlCache();
    // 開いたときは今年・月は「－」（1年分）
    let filterYear = new Date().getFullYear();
    let filterMonth = 0;

    const monthSelect = $('f-month');
    monthSelect.innerHTML = '<option value="0">－</option>' +
      Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
    monthSelect.addEventListener('change', () => {
      filterMonth = Number(monthSelect.value);
      showList();
    });
    $('f-year').addEventListener('change', () => {
      filterYear = Number($('f-year').value);
      showList();
    });

    async function showList() {
      const list = $('list');
      const all = await getAllSlots();
      listUrls.clear();

      // 年の選択肢：記録がある年と今年
      const years = [...new Set([new Date().getFullYear(), ...all.map((s) => Number(s.day.slice(0, 4)))])]
        .sort((a, b) => b - a);
      $('f-year').innerHTML = years.map((y) => `<option value="${y}">${y}</option>`).join('');
      $('f-year').value = filterYear;
      monthSelect.value = filterMonth;

      const prefix = filterMonth ? `${filterYear}-${pad(filterMonth)}-` : `${filterYear}-`;
      const slots = all.filter((s) => s.day.startsWith(prefix));

      const byDay = new Map();
      for (const s of slots) {
        if (!byDay.has(s.day)) byDay.set(s.day, {});
        byDay.get(s.day)[s.type] = s;
      }
      const today = dayKey(Date.now());
      if (today.startsWith(prefix) && !byDay.has(today)) byDay.set(today, {}); // 今日は記録がなくても出す

      list.innerHTML = '';
      if (slots.length > 0) {
        const photoCount = slots.reduce((n, s) => n + s.photos.length, 0);
        const total = slots.reduce((n, s) => n + s.photos.reduce((t, p) => t + p.blob.size, 0), 0);
        const dayCount = new Set(slots.map((s) => s.day)).size;
        list.innerHTML = `<p class="summary">${dayCount}日分・写真${photoCount}枚・合計 ${formatSize(total)}</p>`;
      } else if (byDay.size === 0) {
        list.innerHTML = '<p class="empty">この期間の記録はありません</p>';
      }

      [...byDay.keys()].sort().reverse().forEach((day) => {
        const daySlots = byDay.get(day);
        const sec = document.createElement('section');
        sec.className = 'day';
        sec.innerHTML = `
          <div class="day-head">
            <span class="day-title">${formatDay(day)}${day === today ? '<span class="today">今日</span>' : ''}</span>
            <button class="day-edit">✎ 編集</button>
          </div>
          <div class="day-grid"></div>
          <button class="hito"><span class="hito-label">ひとこと</span><span class="hito-text"></span></button>`;
        sec.querySelector('.day-edit').addEventListener('click', () => openDayEditor(day));
        const grid = sec.querySelector('.day-grid');

        const memo = daySlots[MEMO]?.text;
        const hitoText = sec.querySelector('.hito-text');
        hitoText.textContent = memo || '＋ 書く';
        hitoText.classList.toggle('blank', !memo);
        sec.querySelector('.hito').addEventListener('click', () => openTextEditor(day, MEMO));

        for (const type of TYPE_ORDER) {
          const slot = daySlots[type];
          const cell = document.createElement('div');
          cell.innerHTML = `<div class="cell-label">${TYPES[type].label}</div>`;
          const box = document.createElement('button');
          box.className = 'cell-box';
          if (slot?.text && !slot.photos.length) {
            // 写真がなければ文字を出す（タップで追加方法の選択へ）
            box.classList.add('text');
            const span = document.createElement('span');
            span.textContent = slot.text;
            box.appendChild(span);
            box.addEventListener('click', () => openChooser(day, type));
          } else if (slot) {
            const coverIndex = Math.max(0, slot.photos.findIndex((p) => p.id === slot.cover));
            const img = document.createElement('img');
            img.alt = `${formatDay(day)}の${TYPES[type].label}`;
            img.loading = 'lazy';
            img.src = listUrls.get(slot.photos[coverIndex].blob);
            box.appendChild(img);
            if (slot.photos.length > 1) {
              box.insertAdjacentHTML('beforeend', `<span class="badge">❐${slot.photos.length}</span>`);
            }
            // 1枚ならすぐ拡大、2〜3枚なら縦に並べて表示
            box.addEventListener('click', () => {
              if (slot.photos.length === 1) openViewer(slot.photos, 0, slot.key);
              else openStack(slot.key);
            });
          } else {
            box.classList.add('none');
            box.innerHTML = 'なし<br>＋';
            box.setAttribute('aria-label', `${formatDay(day)}の${TYPES[type].label}を追加`);
            box.addEventListener('click', () => openChooser(day, type));
          }
          cell.appendChild(box);
          grid.appendChild(cell);
        }
        list.appendChild(sec);
      });
    }

    function refreshAll() {
      showList();
      renderDayEditor();
      renderStack();
      renderAlbum();
      renderCalendar();
    }

    // =====================================================
    // 写真を縦に並べる表示（2〜3枚のマスから。1画面に収める）
    // 「代表にする」で代表に、写真をタップすると拡大
    // =====================================================
    let stackKey = null;
    const stackUrls = makeUrlCache();

    function openStack(key) {
      stackKey = key;
      renderStack();
      openLayer($('stack'), {
        onClose: () => {
          stackKey = null;
          stackUrls.clear();
        },
      });
    }

    async function renderStack() {
      if (!stackKey) return;
      const key = stackKey;
      const slot = await getSlot(key);
      if (stackKey !== key) return;
      if (!slot || slot.photos.length === 0) return closeLayer(); // 写真がなくなった
      stackUrls.clear();
      $('stack-title').textContent = `${formatDay(slot.day)}　${TYPES[slot.type].label}`;
      $('stack-text').textContent = slot.text || '';
      const list = $('stack-list');
      list.innerHTML = '';
      slot.photos.forEach((p, i) => {
        const isCover = p.id === slot.cover;
        const item = document.createElement('div');
        item.className = 'stack-item';
        item.innerHTML = `<img alt="写真${i + 1}">
          <button class="cover-btn${isCover ? ' is-cover' : ''}">${isCover ? '★ 代表写真' : '☆ 代表にする'}</button>
          <button class="fav-btn"></button>`;
        const fav = item.querySelector('.fav-btn');
        setFavButton(fav, p.fav);
        fav.addEventListener('click', () => flipFav(key, p, fav));
        item.querySelector('img').src = stackUrls.get(p.blob);
        item.querySelector('img').addEventListener('click', () => openViewer(slot.photos, i, key));
        item.querySelector('.cover-btn').addEventListener('click', async () => {
          if (isCover) return;
          await setCover(key, p.id);
          toast('代表写真にしました');
          refreshAll();
        });
        list.appendChild(item);
      });
    }
    $('stack-close').addEventListener('click', closeLayer);

    // =====================================================
    // アルバム（写真を3列で新しい順に。種類・お気に入り・年月で絞り込み）
    // =====================================================
    const albumUrls = makeUrlCache();
    const albumYear = $('al-year');
    const albumMonth = $('al-month');
    albumMonth.innerHTML = '<option value="0">－</option>' +
      Array.from({ length: 12 }, (_, i) => `<option value="${i + 1}">${i + 1}</option>`).join('');
    document.querySelectorAll('.album-checks input').forEach((el) => el.addEventListener('change', renderAlbum));
    albumYear.addEventListener('change', renderAlbum);
    albumMonth.addEventListener('change', renderAlbum);

    async function renderAlbum() {
      if (!$('page-album').classList.contains('active')) return;
      const all = await getAllSlots();

      // 年の選択肢：「－」と記録がある年
      const year = albumYear.value || '0';
      const years = [...new Set(all.map((s) => s.day.slice(0, 4)))].sort().reverse();
      albumYear.innerHTML = '<option value="0">－</option>' + years.map((y) => `<option value="${y}">${y}</option>`).join('');
      albumYear.value = years.includes(year) ? year : '0';

      const types = new Set([...document.querySelectorAll('[data-album-type]')]
        .filter((el) => el.checked).map((el) => el.dataset.albumType));
      const favOnly = $('al-fav').checked;
      const y = albumYear.value;
      const m = Number(albumMonth.value);

      const items = [];
      for (const s of all) {
        if (!types.has(s.type)) continue;
        if (y !== '0' && s.day.slice(0, 4) !== y) continue;
        if (m && Number(s.day.slice(5, 7)) !== m) continue;
        for (const p of s.photos) {
          if (favOnly && !p.fav) continue;
          items.push({ p, key: s.key, day: s.day });
        }
      }
      // 新しい順（日付 → 撮影時刻）
      items.sort((a, b) => (a.day === b.day ? (b.p.takenAt || 0) - (a.p.takenAt || 0) : a.day < b.day ? 1 : -1));

      albumUrls.clear();
      $('al-count').textContent = `${items.length}枚`;
      const grid = $('album-grid');
      grid.innerHTML = items.length ? '' : '<p class="empty" style="grid-column:1/-1">該当する写真はありません</p>';
      const photos = items.map((it) => it.p);
      const keys = items.map((it) => it.key);
      items.forEach((it, i) => {
        const div = document.createElement('div');
        div.className = 'album-item';
        div.innerHTML = '<img loading="lazy" alt=""><button class="fav-btn"></button>';
        const img = div.querySelector('img');
        img.src = albumUrls.get(it.p.blob);
        img.alt = `${formatDay(it.day)}の写真`;
        img.addEventListener('click', () => openViewer(photos, i, keys)); // 左右でアルバムの順に送れる
        const fav = div.querySelector('.fav-btn');
        setFavButton(fav, it.p.fav);
        fav.addEventListener('click', () => flipFav(it.key, it.p, fav));
        grid.appendChild(div);
      });
    }

    // =====================================================
    // カレンダー（1日1枚の写真。夕食→昼食→朝食→日記の順で最初にある代表写真）
    // =====================================================
    const CAL_PICK = ['dinner', 'lunch', 'breakfast', 'diary'];
    const calUrls = makeUrlCache();
    let calYear = new Date().getFullYear();
    let calMonth = new Date().getMonth(); // 0〜11

    async function renderCalendar() {
      if (!$('page-calendar').classList.contains('active')) return;
      const y = calYear;
      const m = calMonth;
      const prefix = `${y}-${pad(m + 1)}-`;
      const slots = (await getAllSlots()).filter((s) => s.day.startsWith(prefix));
      if (y !== calYear || m !== calMonth) return; // 待っている間に月が変わった

      const byDay = new Map();
      for (const s of slots) {
        if (!byDay.has(s.day)) byDay.set(s.day, []);
        byDay.get(s.day).push(s);
      }
      calUrls.clear();
      $('cal-title').textContent = `${y}年${m + 1}月`;
      const now = new Date();
      $('cal-today').style.visibility = y === now.getFullYear() && m === now.getMonth() ? 'hidden' : 'visible';

      const grid = $('cal-grid');
      grid.innerHTML = '';
      const firstWeekday = new Date(y, m, 1).getDay();
      const days = new Date(y, m + 1, 0).getDate();
      const today = dayKey(Date.now());
      for (let i = 0; i < firstWeekday; i++) grid.appendChild(document.createElement('span'));

      for (let d = 1; d <= days; d++) {
        const day = prefix + pad(d);
        const list = byDay.get(day) || [];
        const weekday = (firstWeekday + d - 1) % 7;
        const cell = document.createElement('button');
        cell.className = 'cal-day' + (weekday === 0 ? ' sun' : weekday === 6 ? ' sat' : '') + (day === today ? ' today' : '');
        cell.setAttribute('aria-label', `${formatDay(day)}を開く`);

        let photo = null;
        for (const t of CAL_PICK) {
          const s = list.find((x) => x.type === t && x.photos.length);
          if (s) {
            photo = s.photos.find((p) => p.id === s.cover) || s.photos[0];
            break;
          }
        }
        if (photo) {
          const img = document.createElement('img');
          img.loading = 'lazy';
          img.alt = '';
          img.src = calUrls.get(photo.blob);
          cell.appendChild(img);
          cell.classList.add('has-photo');
        } else if (list.length) {
          cell.insertAdjacentHTML('beforeend', '<span class="cal-dot"></span>');
        }
        cell.insertAdjacentHTML('beforeend', `<span class="cal-num">${d}</span>`);
        cell.addEventListener('click', () => openDayEditor(day));
        grid.appendChild(cell);
      }
    }

    function moveMonth(step) {
      const d = new Date(calYear, calMonth + step, 1);
      calYear = d.getFullYear();
      calMonth = d.getMonth();
      renderCalendar();
    }
    $('cal-prev').addEventListener('click', () => moveMonth(-1));
    $('cal-next').addEventListener('click', () => moveMonth(1));
    $('cal-today').addEventListener('click', () => {
      calYear = new Date().getFullYear();
      calMonth = new Date().getMonth();
      renderCalendar();
    });
    // 左右にスワイプで月を切り替え
    let calTouchX = null;
    $('cal-grid').addEventListener('touchstart', (e) => (calTouchX = e.touches[0].clientX), { passive: true });
    $('cal-grid').addEventListener('touchend', (e) => {
      if (calTouchX === null) return;
      const dx = e.changedTouches[0].clientX - calTouchX;
      calTouchX = null;
      if (Math.abs(dx) > 60) moveMonth(dx < 0 ? 1 : -1);
    });

    // =====================================================
    // ページの切り替え（ボトムナビ）と設定
    // =====================================================
    document.querySelectorAll('.bottom-nav [data-page]').forEach((btn) => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.bottom-nav [data-page]').forEach((b) => b.classList.toggle('active', b === btn));
        document.querySelectorAll('.page').forEach((p) => p.classList.toggle('active', p.id === 'page-' + btn.dataset.page));
        window.scrollTo(0, 0);
        if (btn.dataset.page === 'album') renderAlbum();
        if (btn.dataset.page === 'calendar') renderCalendar();
      });
    });
    $('nav-add').addEventListener('click', openAdder);

    // 食事の時間帯（終了は開始より後になるように直す）
    document.querySelectorAll('.set-time').forEach((row) => {
      const meal = row.dataset.meal;
      const start = row.querySelector('.t-start');
      const end = row.querySelector('.t-end');
      start.innerHTML = Array.from({ length: 24 }, (_, h) => `<option value="${h}">${h}</option>`).join('');
      end.innerHTML = Array.from({ length: 24 }, (_, h) => `<option value="${h + 1}">${h + 1}</option>`).join('');
      start.value = mealTimes[meal][0];
      end.value = mealTimes[meal][1];
      const save = (changed) => {
        let s = Number(start.value);
        let e = Number(end.value);
        if (e <= s) {
          if (changed === start) e = Math.min(24, s + 1);
          else s = Math.max(0, e - 1);
          start.value = s;
          end.value = e;
        }
        mealTimes[meal] = [s, e];
        try {
          localStorage.setItem('meal-log-times', JSON.stringify(mealTimes));
        } catch {
          // 保存できなくても今回は使える
        }
        toast(`${TYPES[meal].label}は ${s}時〜${e}時 にしました`);
      };
      start.addEventListener('change', () => save(start));
      end.addEventListener('change', () => save(end));
    });

    document.querySelectorAll('input[name="camera"]').forEach((radio) => {
      radio.checked = radio.value === cameraSetting;
      radio.addEventListener('change', () => {
        if (radio.checked) {
          setCameraSetting(radio.value);
          toast(radio.value === 'quiet' ? '静音カメラを使います' : 'きれいなカメラを使います');
        }
      });
    });

    // =====================================================
    // バックアップ（暗号化した ZIP = .mlbk）
    // ZIP の中身:
    //   records.json … 食事の情報（日付・種類・代表・写真ごとの撮影日時など）
    //   photos/2026-11-24_lunch_1.jpg … 写真
    // =====================================================
    // パスワードはアプリに埋め込み（このアプリ以外では開けないようにするのが目的）。
    // ※ この文字列を変えると、それ以前のバックアップが読めなくなるので変更しないこと
    const BACKUP_PASSWORD = 'meal-log/7f3c9a1e-backup-key/2026';
    const MAGIC = new TextEncoder().encode('MLBK1'); // ファイルの先頭に付ける目印

    async function deriveKey(salt) {
      const base = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(BACKUP_PASSWORD), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    // ファイルの並び: 目印(5) + salt(16) + iv(12) + 暗号化されたZIP
    async function encryptBackup(zipBlob) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(salt);
      const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, await zipBlob.arrayBuffer());
      return new Blob([MAGIC, salt, iv, data], { type: 'application/octet-stream' });
    }

    function isEncrypted(bytes) {
      return MAGIC.every((b, i) => bytes[i] === b);
    }

    async function decryptBackup(bytes) {
      const key = await deriveKey(bytes.slice(5, 21));
      try {
        return await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(21, 33) }, key, bytes.slice(33));
      } catch {
        throw new Error('バックアップを解読できませんでした（ファイルが壊れている可能性があります）');
      }
    }

    $('export-btn').addEventListener('click', async () => {
      const slots = await getAllSlots();
      if (slots.length === 0) {
        toast('バックアップする記録がありません');
        return;
      }
      toast('バックアップを作成中…', 0);
      try {
        const zip = new JSZip();
        const list = slots.map((s) => ({
          day: s.day,
          type: s.type,
          cover: s.cover,
          text: s.text || '',
          photos: s.photos.map((p, i) => {
            const file = `photos/${s.day}_${s.type}_${i + 1}.jpg`;
            zip.file(file, p.blob); // JPEG は圧縮済みなので、そのまま入れる
            const { blob, ...info } = p;
            return { ...info, file };
          }),
        }));
        zip.file('records.json', JSON.stringify({ app: 'meal-log', version: 4, slots: list }, null, 2), {
          compression: 'DEFLATE',
        });
        const blob = await encryptBackup(await zip.generateAsync({ type: 'blob' }));
        const name = `meal-log-backup_${stamp(Date.now())}.mlbk`;

        // ダウンロードとして保存（誤送信を防ぐため、共有メニューは使わない）
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        const photoCount = slots.reduce((n, s) => n + s.photos.length, 0);
        toast(`ダウンロードしました（写真${photoCount}枚・${formatSize(blob.size)}）`, 4000);
      } catch (e) {
        toast('バックアップに失敗しました：' + e.message, 5000);
      }
    });

    const importFile = $('import-file');
    importFile.addEventListener('change', async () => {
      const file = importFile.files[0];
      importFile.value = '';
      if (!file) return;
      toast('読み込み中…', 0);
      try {
        // 暗号化バックアップ(.mlbk)なら解読、以前の ZIP ならそのまま読む
        const bytes = new Uint8Array(await file.arrayBuffer());
        const zipData = isEncrypted(bytes) ? await decryptBackup(bytes) : bytes;
        let zip;
        try {
          zip = await JSZip.loadAsync(zipData);
        } catch {
          throw new Error('食事記録アプリのバックアップではありません');
        }
        const json = zip.file('records.json');
        if (!json) throw new Error('食事記録アプリのバックアップではありません');
        const data = JSON.parse(await json.async('string'));

        // どの形式でも「日・種類・写真(file付き)」の並びにそろえる
        let parts;
        if (data.slots) {
          parts = data.slots.map((s) => ({ ...s, type: normType(s.type) })); // 第3版以降の形式
        } else if (data.meals) {
          parts = data.meals.map(fromV2Meal); // 食事単位だった形式
        } else if (data.records) {
          parts = data.records.map((r) => {
            const part = fromV1Record(r, null); // 写真1枚=1件だった形式
            part.photos[0].file = r.file;
            return part;
          });
        } else {
          throw new Error('食事記録アプリのバックアップではありません');
        }

        // すでにある写真（同じid）は飛ばす → 何度読み込んでも重複しない
        const existing = new Set((await getAllSlots()).flatMap((s) => s.photos.map((p) => p.id)));
        let added = 0;
        let skipped = 0;
        let texts = 0;
        let overflow = 0;
        for (const part of parts) {
          // 文字は、こちらにまだ文字がないときだけ入れる
          if (part.text && (await setSlotText(part.day, part.type, part.text, true))) texts++;
          const photos = [];
          for (const p of part.photos) {
            const f = zip.file(p.file);
            if (existing.has(p.id) || !f) {
              skipped++;
              continue;
            }
            const { file: _, ...info } = p;
            photos.push({ ...info, blob: new Blob([await f.async('arraybuffer')], { type: 'image/jpeg' }) });
            existing.add(p.id);
          }
          if (photos.length === 0) continue;
          // 1つの枠は3枚まで（3枚を超える分は代表を残して減らし、入りきらない分は入れない）
          const ordered = trimSlot({ photos, cover: part.cover }).photos;
          const n = await addPhotosToSlot(part.day, part.type, ordered, part.cover);
          added += n;
          overflow += photos.length - n;
        }
        toast(`読み込みました：写真${added}枚` + (texts ? `・文字${texts}件` : '') + 'を追加' +
          (skipped ? `・重複などで飛ばした ${skipped}枚` : '') +
          (overflow ? `・${MAX_PHOTOS}枚を超えて入らなかった ${overflow}枚` : ''), 5000);
        refreshAll();
      } catch (e) {
        toast('読み込みに失敗しました：' + e.message, 5000);
      }
    });

    showList().catch((e) => toast('データを開けませんでした：' + e.message, 8000));
  </script>
</body>
</html>

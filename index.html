<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>食事記録アプリ</title>
  <!-- ZIP ファイルを作る・読むためのライブラリ -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <style>
    :root {
      --accent: #ff8a3d;
      --green: #4a8f6a;
      --blue: #4a76a8;
      --bg: #fffaf3;
      --text: #333;
      --sub: #888;
      --line: #e8e0d4;
    }
    * {
      box-sizing: border-box;
    }
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--text);
    }
    h1 {
      font-size: 1.4em;
      margin: 0 0 12px;
    }
    button {
      font-family: inherit;
      cursor: pointer;
    }
    .hidden-input {
      display: none;
    }

    /* ===== ホーム ===== */
    .buttons {
      display: flex;
      gap: 8px;
    }
    .camera-btn {
      flex: 1;
      padding: 14px 4px;
      border: none;
      background: var(--accent);
      color: #fff;
      font-size: 0.95em;
      font-weight: bold;
      text-align: center;
      border-radius: 12px;
      line-height: 1.4;
    }
    .camera-btn small {
      display: block;
      font-weight: normal;
      font-size: 0.72em;
      opacity: 0.9;
    }
    .camera-btn.quiet {
      background: var(--green);
    }
    .camera-btn.gallery {
      background: var(--blue);
    }
    .backup {
      display: flex;
      gap: 8px;
      margin: 12px 0;
    }
    .backup-btn {
      flex: 1;
      padding: 10px 8px;
      border: 1px solid #ccc;
      background: #fff;
      color: #555;
      font-size: 0.9em;
      text-align: center;
      border-radius: 8px;
    }
    .summary {
      font-size: 0.8em;
      color: var(--sub);
      margin: 0 0 8px;
    }

    /* ----- 一覧（1日 = 4マス） ----- */
    .day {
      background: #fff;
      border-radius: 12px;
      padding: 10px 10px 12px;
      margin-bottom: 12px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.08);
    }
    .day-head {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .day-title {
      font-weight: bold;
    }
    .day-title .today {
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 4px;
      background: var(--accent);
      color: #fff;
      font-size: 0.75em;
      font-weight: normal;
    }
    .day-edit {
      margin-left: auto;
      padding: 4px 8px;
      border: none;
      background: none;
      color: var(--sub);
      font-size: 0.85em;
    }
    .day-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .cell-label {
      font-size: 0.8em;
      color: var(--sub);
      text-align: center;
      margin-bottom: 3px;
    }
    .cell-box {
      position: relative;
      display: block;
      width: 100%;
      aspect-ratio: 1;
      padding: 0;
      border: none;
      border-radius: 8px;
      overflow: hidden;
      background: #eee;
    }
    .cell-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .cell-box.none {
      border: 1px dashed #ccc;
      background: #faf7f2;
      color: #bbb;
      font-size: 0.8em;
      line-height: 1.5;
    }
    /* 複数枚あるときの印 */
    .badge {
      position: absolute;
      right: 4px;
      bottom: 4px;
      padding: 1px 5px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
      font-size: 0.72em;
    }

    /* ===== 重ねて表示する画面 ===== */
    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 10;
    }
    .overlay.open {
      display: flex;
      flex-direction: column;
    }
    /* 下から出るシート */
    .sheet-overlay {
      background: rgba(0, 0, 0, 0.45);
      justify-content: flex-end;
    }
    .sheet {
      background: var(--bg);
      border-radius: 16px 16px 0 0;
      padding: 16px 16px 24px;
      max-height: 92vh;
      overflow-y: auto;
    }
    .sheet h2 {
      font-size: 1.1em;
      margin: 0 0 12px;
    }
    .label {
      font-size: 0.85em;
      color: var(--sub);
      margin: 14px 0 6px;
    }
    .note {
      font-size: 0.85em;
      color: var(--green);
      margin-top: 8px;
      min-height: 1.2em;
    }
    .thumb-row {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .thumb-row img {
      flex: none;
      width: 80px;
      height: 80px;
      object-fit: cover;
      border-radius: 8px;
    }
    .types {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 6px;
    }
    .type-btn {
      padding: 12px 0;
      border: 1px solid #ccc;
      background: #fff;
      border-radius: 8px;
      color: inherit;
      font-size: 0.95em;
    }
    .type-btn.selected {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
      font-weight: bold;
    }
    .date-input {
      width: 100%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      font-family: inherit;
      font-size: 1em;
    }
    .actions {
      display: flex;
      gap: 8px;
      margin-top: 20px;
    }
    .actions button {
      flex: 1;
      padding: 14px;
      border-radius: 10px;
      font-size: 1em;
    }
    .btn-sub {
      border: 1px solid #ccc;
      background: #fff;
      color: inherit;
    }
    .btn-main {
      border: none;
      background: var(--accent);
      color: #fff;
      font-weight: bold;
    }
    .choose-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .choose-list .camera-btn {
      padding: 14px;
    }

    /* ----- 日の編集画面 ----- */
    #day-editor {
      background: var(--bg);
      overflow-y: auto;
      padding: 16px;
    }
    .ed-top {
      display: flex;
      align-items: center;
      margin-bottom: 8px;
    }
    .ed-top h2 {
      font-size: 1.2em;
      margin: 0;
    }
    .ed-top button {
      margin-left: auto;
      padding: 8px 16px;
      border: 1px solid #ccc;
      border-radius: 8px;
      background: #fff;
      color: inherit;
    }
    .ed-sec {
      background: #fff;
      border-radius: 12px;
      padding: 10px;
      margin-top: 10px;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
    }
    .ed-head {
      display: flex;
      align-items: center;
      font-weight: bold;
      margin-bottom: 8px;
    }
    .ed-add {
      margin-left: auto;
      padding: 6px 12px;
      border: 1px dashed #bbb;
      border-radius: 8px;
      background: #fff;
      color: #555;
      font-size: 0.85em;
      font-weight: normal;
    }
    .ed-none {
      color: #bbb;
      font-size: 0.85em;
    }
    .ed-photos {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }
    .ed-photo {
      position: relative;
    }
    .ed-photo img {
      display: block;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 8px;
      cursor: pointer;
    }
    .ed-photo.cover img {
      outline: 3px solid var(--accent);
      outline-offset: -3px;
    }
    .ed-photo .star,
    .ed-photo .remove {
      position: absolute;
      top: 4px;
      width: 30px;
      height: 30px;
      padding: 0;
      border: none;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.55);
      color: #fff;
      font-size: 16px;
      line-height: 30px;
    }
    .ed-photo .star {
      left: 4px;
    }
    .ed-photo.cover .star {
      background: var(--accent);
    }
    .ed-photo .remove {
      right: 4px;
    }
    .ed-photo select {
      width: 100%;
      margin-top: 4px;
      padding: 4px;
      border: 1px solid #ccc;
      border-radius: 6px;
      background: #fff;
      font-family: inherit;
      font-size: 0.8em;
    }

    /* ----- 写真の拡大表示 ----- */
    #viewer {
      background: #000;
      color: #fff;
      z-index: 15;
    }
    .viewer-top {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 8px 8px 16px;
    }
    #viewer-cover {
      padding: 6px 12px;
      border: 1px solid #888;
      border-radius: 16px;
      background: none;
      color: #fff;
      font-size: 0.85em;
    }
    #viewer-cover.is-cover {
      border-color: var(--accent);
      background: var(--accent);
    }
    #viewer-close {
      margin-left: auto;
      border: none;
      background: none;
      color: #fff;
      font-size: 1.8em;
      padding: 0 12px;
    }
    #viewer-img {
      flex: 1;
      width: 100%;
      min-height: 0;
      object-fit: contain;
    }
    #viewer-info {
      padding: 12px 16px 24px;
      color: #bbb;
      font-size: 0.8em;
      text-align: center;
    }
    .viewer-nav {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 64px;
      border: none;
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      font-size: 1.4em;
    }
    #viewer-prev {
      left: 0;
      border-radius: 0 8px 8px 0;
    }
    #viewer-next {
      right: 0;
      border-radius: 8px 0 0 8px;
    }

    /* ----- 静音カメラ ----- */
    #quiet-cam {
      background: #000;
      z-index: 20;
    }
    #quiet-video {
      flex: 1;
      width: 100%;
      min-height: 0;
      object-fit: contain;
    }
    .cam-bar {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding: 20px 16px 32px;
    }
    .cam-bar button {
      width: 80px;
      border: none;
      background: none;
      color: #fff;
      font-size: 1em;
    }
    #shutter {
      width: 72px;
      height: 72px;
      border-radius: 50%;
      background: #fff;
      border: 5px solid #888;
    }
    #shutter:active {
      background: #ddd;
    }
    /* 音の代わりに、撮った瞬間に画面を白く光らせる */
    #flash {
      position: absolute;
      inset: 0;
      background: #fff;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #flash.on {
      opacity: 0.8;
      transition: none;
    }
    #cam-msg {
      position: absolute;
      top: 40%;
      left: 16px;
      right: 16px;
      color: #fff;
      text-align: center;
    }

    /* ----- お知らせ ----- */
    #toast {
      position: fixed;
      left: 16px;
      right: 16px;
      bottom: 24px;
      z-index: 30;
      padding: 12px 16px;
      border-radius: 10px;
      background: rgba(40, 40, 40, 0.92);
      color: #fff;
      font-size: 0.9em;
      text-align: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s;
    }
    #toast.show {
      opacity: 1;
    }
  </style>
</head>
<body>
  <h1>食事記録アプリ</h1>

  <div class="buttons">
    <button class="camera-btn" data-add="app">📷 カメラ<small>きれい・音あり</small></button>
    <button class="camera-btn quiet" data-add="quiet">🔇 静音カメラ<small>音なし</small></button>
    <button class="camera-btn gallery" data-add="gallery">🖼 ギャラリー<small>撮った写真から</small></button>
  </div>

  <div class="backup">
    <button id="export-btn" class="backup-btn">💾 バックアップ</button>
    <label for="import-file" class="backup-btn">📂 読み込み</label>
  </div>

  <div id="list"></div>

  <!-- 写真を受け取るための部品（画面には出さない） -->
  <input type="file" id="camera-input" class="hidden-input" accept="image/*" capture="environment">
  <input type="file" id="gallery-input" class="hidden-input" accept="image/*" multiple>
  <!-- .mlbk は Android が知らない拡張子で、accept で絞ると選べなくなるため、絞らずに中身で判定する -->
  <input type="file" id="import-file" class="hidden-input">

  <!-- 撮影後の確認（種類・日付を確かめて保存） -->
  <div id="confirm" class="overlay sheet-overlay" style="z-index:12">
    <div class="sheet">
      <h2>写真を追加</h2>
      <div id="confirm-photos" class="thumb-row"></div>
      <div class="label">日付</div>
      <input type="date" id="confirm-date" class="date-input">
      <div class="label">種類</div>
      <div id="confirm-types" class="types"></div>
      <div id="confirm-note" class="note"></div>
      <div class="actions">
        <button id="confirm-cancel" class="btn-sub">キャンセル</button>
        <button id="confirm-save" class="btn-main">保存</button>
      </div>
    </div>
  </div>

  <!-- 「なし」や「＋追加」から開く、追加方法の選択 -->
  <div id="chooser" class="overlay sheet-overlay" style="z-index:14">
    <div class="sheet">
      <h2 id="chooser-title"></h2>
      <div class="choose-list">
        <button class="camera-btn" data-choose="app">📷 カメラ</button>
        <button class="camera-btn quiet" data-choose="quiet">🔇 静音カメラ</button>
        <button class="camera-btn gallery" data-choose="gallery">🖼 ギャラリー</button>
      </div>
      <div class="actions">
        <button id="chooser-cancel" class="btn-sub">キャンセル</button>
      </div>
    </div>
  </div>

  <!-- 日の編集画面 -->
  <div id="day-editor" class="overlay">
    <div class="ed-top">
      <h2 id="ed-title"></h2>
      <button id="ed-close">閉じる</button>
    </div>
    <div id="ed-body"></div>
  </div>

  <!-- 写真の拡大表示 -->
  <div id="viewer" class="overlay">
    <div class="viewer-top">
      <span id="viewer-count"></span>
      <button id="viewer-cover"></button>
      <button id="viewer-close" aria-label="閉じる">×</button>
    </div>
    <img id="viewer-img" alt="食事の写真">
    <div id="viewer-info"></div>
    <button id="viewer-prev" class="viewer-nav" aria-label="前の写真">‹</button>
    <button id="viewer-next" class="viewer-nav" aria-label="次の写真">›</button>
  </div>

  <!-- 静音カメラ -->
  <div id="quiet-cam" class="overlay">
    <video id="quiet-video" autoplay playsinline muted></video>
    <div id="cam-msg"></div>
    <div class="cam-bar">
      <button id="cam-cancel">キャンセル</button>
      <button id="shutter" aria-label="撮影"></button>
      <span style="width:80px"></span>
    </div>
    <div id="flash"></div>
  </div>

  <div id="toast"></div>

  <script>
    // =====================================================
    // 共通の部品
    // =====================================================
    const $ = (id) => document.getElementById(id);
    const pad = (n) => String(n).padStart(2, '0');

    const TYPES = {
      breakfast: { label: '朝食', icon: '🌅' },
      lunch: { label: '昼食', icon: '☀️' },
      dinner: { label: '夕食', icon: '🌙' },
      snack: { label: '間食', icon: '🍪' },
    };
    const TYPE_ORDER = ['breakfast', 'lunch', 'dinner', 'snack'];
    const SOURCE_ICON = { app: '📷', quiet: '🔇', gallery: '🖼' };

    // 時刻から食事の種類を決める
    function typeByTime(time) {
      const h = new Date(time).getHours();
      if (h >= 5 && h < 10) return 'breakfast';
      if (h >= 10 && h < 15) return 'lunch';
      if (h >= 15 && h < 17) return 'snack';
      if (h >= 17 && h < 23) return 'dinner';
      return 'snack';
    }

    function formatSize(bytes) {
      if (bytes < 1024 * 1024) return Math.round(bytes / 1024) + ' KB';
      return (bytes / 1024 / 1024).toFixed(1) + ' MB';
    }
    // 日付は "2026-11-24" の文字列で扱う
    function dayKey(time) {
      const d = new Date(time);
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
    }
    function parseDay(day) {
      const [y, m, d] = day.split('-').map(Number);
      return new Date(y, m - 1, d);
    }
    function formatDay(day) {
      const d = parseDay(day);
      return `${d.getMonth() + 1}月${d.getDate()}日(${'日月火水木金土'[d.getDay()]})`;
    }
    function formatDateTime(time) {
      const d = new Date(time);
      return `${d.getMonth() + 1}/${d.getDate()} ${d.getHours()}:${pad(d.getMinutes())}`;
    }
    function stamp(time) {
      const d = new Date(time);
      return `${dayKey(time)}_${pad(d.getHours())}${pad(d.getMinutes())}`;
    }
    const slotKey = (day, type) => `${day}_${type}`;
    const newId = () => crypto.randomUUID();

    let toastTimer;
    function toast(message, ms = 2500) {
      const el = $('toast');
      el.textContent = message;
      el.classList.add('show');
      clearTimeout(toastTimer);
      if (ms) toastTimer = setTimeout(() => el.classList.remove('show'), ms);
    }

    // 写真の表示用URL（同じ写真には同じURLを使い回し、不要になったら解放）
    function makeUrlCache() {
      const map = new Map();
      return {
        get(blob) {
          if (!map.has(blob)) map.set(blob, URL.createObjectURL(blob));
          return map.get(blob);
        },
        clear() {
          map.forEach((url) => URL.revokeObjectURL(url));
          map.clear();
        },
      };
    }

    // =====================================================
    // データベース（IndexedDB）
    // 1件 = ある日のある種類の食事（例：11月24日の昼食）。1日に各種類1件まで
    //   { key: "2026-11-24_lunch", day, type, cover: 代表写真のid,
    //     photos: [{ id, blob, width, height, source, originalSize, takenAt, addedAt }] }
    // =====================================================

    // 以前の形式からの変換。写真の id は作り方を固定して、
    // 古いバックアップを読み込んでも同じ写真が二重に入らないようにする
    function fromV1Record(r, blob) {
      return {
        day: dayKey(r.createdAt),
        type: typeByTime(r.createdAt),
        photos: [{
          id: `legacy-${r.createdAt}-0`, blob, width: r.width, height: r.height,
          source: r.source, originalSize: r.originalSize, takenAt: r.createdAt, addedAt: r.createdAt,
        }],
      };
    }
    function fromV2Meal(m) {
      return {
        day: dayKey(m.eatenAt),
        type: m.type,
        photos: m.photos.map((p, i) => ({
          ...p, id: `legacy-${m.createdAt}-${i}`, takenAt: m.eatenAt, addedAt: m.createdAt + i,
        })),
      };
    }

    let dbPromise = null;
    function getDB() {
      if (!dbPromise) {
        dbPromise = new Promise((resolve, reject) => {
          const req = indexedDB.open('meal-log', 3);
          req.onupgradeneeded = () => {
            const db = req.result;
            const tx = req.transaction;
            const slots = db.objectStoreNames.contains('slots')
              ? tx.objectStore('slots')
              : db.createObjectStore('slots', { keyPath: 'key' });

            // 以前の形式のデータを集めて、同じ日・同じ種類は1つにまとめる
            const merged = new Map();
            const mergeIn = (part) => {
              const key = slotKey(part.day, part.type);
              if (!merged.has(key)) merged.set(key, { key, day: part.day, type: part.type, photos: [] });
              merged.get(key).photos.push(...part.photos);
            };
            const readOld = (name, convert, next) => {
              if (!db.objectStoreNames.contains(name)) return next();
              tx.objectStore(name).openCursor().onsuccess = (e) => {
                const cursor = e.target.result;
                if (cursor) {
                  mergeIn(convert(cursor.value));
                  cursor.continue();
                } else {
                  db.deleteObjectStore(name);
                  next();
                }
              };
            };
            readOld('records', (r) => fromV1Record(r, r.photo), () =>
              readOld('meals', fromV2Meal, () => {
                merged.forEach((s) => {
                  s.photos.sort((a, b) => a.addedAt - b.addedAt);
                  s.cover = s.photos[0].id; // 一番最初に登録した写真を代表に
                  slots.put(s);
                });
              }));
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => reject(req.error);
        });
      }
      return dbPromise;
    }

    async function withStore(mode, action) {
      const db = await getDB();
      return new Promise((resolve, reject) => {
        const tx = db.transaction('slots', mode);
        const req = action(tx.objectStore('slots'));
        tx.oncomplete = () => resolve(req.result);
        tx.onerror = () => reject(tx.error);
      });
    }
    const getAllSlots = () => withStore('readonly', (s) => s.getAll());
    const getSlot = (key) => withStore('readonly', (s) => s.get(key));
    const getDaySlots = (day) => withStore('readonly', (s) => s.getAll(IDBKeyRange.bound(day + '_', day + '_￿')));
    const putSlot = (slot) => withStore('readwrite', (s) => s.put(slot));
    const deleteSlot = (key) => withStore('readwrite', (s) => s.delete(key));

    // 写真を、ある日のある種類に追加（なければ作る。最初の写真が代表）
    async function addPhotosToSlot(day, type, photos, preferredCover) {
      const key = slotKey(day, type);
      const slot = (await getSlot(key)) || { key, day, type, photos: [], cover: null };
      const isNew = slot.photos.length === 0;
      slot.photos.push(...photos);
      if (isNew && preferredCover && photos.some((p) => p.id === preferredCover)) slot.cover = preferredCover;
      if (!slot.cover) slot.cover = slot.photos[0].id;
      await putSlot(slot);
    }

    // 写真を1枚取り外す（代表だったら次の写真が代表に。空になったら食事ごと消す）
    async function takePhoto(key, photoId) {
      const slot = await getSlot(key);
      const i = slot.photos.findIndex((p) => p.id === photoId);
      const [photo] = slot.photos.splice(i, 1);
      if (slot.photos.length === 0) {
        await deleteSlot(key);
      } else {
        if (slot.cover === photoId) slot.cover = slot.photos[0].id;
        await putSlot(slot);
      }
      return { photo, slot };
    }

    async function movePhoto(key, photoId, toType) {
      const { photo, slot } = await takePhoto(key, photoId);
      await addPhotosToSlot(slot.day, toType, [photo]);
    }

    async function setCover(key, photoId) {
      const slot = await getSlot(key);
      slot.cover = photoId;
      await putSlot(slot);
    }

    // =====================================================
    // 重ねて表示する画面の管理
    // Android の「戻る」で、アプリを抜けずに一番上の画面だけ閉じるようにする
    // =====================================================
    const layers = [];
    let closeWaiters = [];
    function openLayer(el, { onClose, beforeClose } = {}) {
      el.classList.add('open');
      layers.push({ el, onClose, beforeClose });
      history.pushState({ layer: layers.length }, '');
    }
    // 一番上の画面を閉じる。閉じ終わったら完了する（続けて別の画面を開くときは await する）
    function closeLayer() {
      return new Promise((resolve) => {
        closeWaiters.push(resolve);
        history.back(); // → popstate で実際に閉じる
      });
    }
    function topLayer() {
      return layers[layers.length - 1]?.el;
    }
    window.addEventListener('popstate', () => {
      const top = layers[layers.length - 1];
      const waiters = closeWaiters;
      closeWaiters = [];
      if (top) {
        if (top.beforeClose && !top.beforeClose()) {
          history.pushState({ layer: layers.length }, ''); // 閉じるのをやめた
        } else {
          layers.pop();
          top.el.classList.remove('open');
          if (top.onClose) top.onClose();
        }
      }
      waiters.forEach((resolve) => resolve());
    });
    // シートの外側（暗い部分）をタップしたら閉じる
    document.querySelectorAll('.sheet-overlay').forEach((el) => {
      el.addEventListener('click', (e) => {
        if (e.target === el) closeLayer();
      });
    });

    // =====================================================
    // 写真の取り込み
    // =====================================================
    // 長い辺を 1000px にして JPEG に変換（数MB → 100〜200KB 程度になる）
    async function resizeImage(source, maxSize = 1000) {
      const bitmap = await createImageBitmap(source);
      const scale = Math.min(1, maxSize / Math.max(bitmap.width, bitmap.height));
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(bitmap.width * scale);
      canvas.height = Math.round(bitmap.height * scale);
      canvas.getContext('2d').drawImage(bitmap, 0, 0, canvas.width, canvas.height);
      bitmap.close();
      const blob = await new Promise((resolve) => canvas.toBlob(resolve, 'image/jpeg', 0.85));
      return { blob, width: canvas.width, height: canvas.height };
    }

    // JPEG の中に記録された撮影日時（EXIF）を読む。読めなければ null
    async function readExifDate(file) {
      try {
        const v = new DataView(await file.slice(0, 256 * 1024).arrayBuffer());
        if (v.getUint16(0) !== 0xffd8) return null; // JPEG ではない
        let off = 2;
        while (off + 10 < v.byteLength) {
          const marker = v.getUint16(off);
          if ((marker & 0xff00) !== 0xff00) break;
          if (marker === 0xffe1 && v.getUint32(off + 4) === 0x45786966) { // "Exif"
            const t = off + 10; // ここから TIFF 形式
            const le = v.getUint16(t) === 0x4949;
            const u16 = (p) => v.getUint16(p, le);
            const u32 = (p) => v.getUint32(p, le);
            const find = (ifd, tag) => {
              const n = u16(ifd);
              for (let i = 0; i < n; i++) if (u16(ifd + 2 + i * 12) === tag) return ifd + 2 + i * 12;
              return null;
            };
            const ifd0 = t + u32(t + 4);
            let entry = null;
            const exifIfd = find(ifd0, 0x8769);
            if (exifIfd) entry = find(t + u32(exifIfd + 8), 0x9003); // 撮影日時
            if (!entry) entry = find(ifd0, 0x0132); // 更新日時
            if (!entry) return null;
            let s = '';
            for (let i = 0; i < 19; i++) s += String.fromCharCode(v.getUint8(t + u32(entry + 8) + i));
            const m = s.match(/(\d{4}):(\d\d):(\d\d) (\d\d):(\d\d):(\d\d)/);
            if (!m) return null;
            return new Date(+m[1], m[2] - 1, +m[3], +m[4], +m[5], +m[6]).getTime();
          }
          off += 2 + v.getUint16(off + 2);
        }
      } catch {
        // 読めない形式は気にしない
      }
      return null;
    }

    async function makePhoto(source, sourceType, originalSize, takenAt) {
      const { blob, width, height } = await resizeImage(source);
      return { id: newId(), blob, width, height, source: sourceType, originalSize, takenAt, addedAt: Date.now() };
    }

    // 追加先（「なし」や「＋追加」から来たときだけ決まっている）
    let addTarget = null;

    async function receivePhotos(photos) {
      if (addTarget) {
        const { day, type } = addTarget;
        addTarget = null;
        await addPhotosToSlot(day, type, photos);
        toast(`${formatDay(day)}の${TYPES[type].label}に追加しました`);
        refreshAll();
      } else {
        openConfirm(photos);
      }
    }

    async function handleFiles(files, sourceType) {
      if (files.length === 0) return;
      toast('写真を読み込み中…', 0);
      try {
        const photos = [];
        for (const f of files) {
          const takenAt = sourceType === 'gallery' ? (await readExifDate(f)) ?? f.lastModified : Date.now();
          photos.push(await makePhoto(f, sourceType, f.size, takenAt));
        }
        toast('', 1);
        await receivePhotos(photos);
      } catch (e) {
        toast('写真を読み込めませんでした：' + e.message, 5000);
      }
    }

    const cameraInput = $('camera-input');
    const galleryInput = $('gallery-input');
    cameraInput.addEventListener('change', async () => {
      await handleFiles([...cameraInput.files], 'app');
      cameraInput.value = '';
    });
    galleryInput.addEventListener('change', async () => {
      await handleFiles([...galleryInput.files], 'gallery');
      galleryInput.value = '';
    });

    function startAdd(how) {
      if (how === 'app') cameraInput.click();
      else if (how === 'gallery') galleryInput.click();
      else openQuietCam();
    }

    // ホームの3つのボタン：撮ったあとに確認画面で種類を選ぶ
    document.querySelectorAll('[data-add]').forEach((btn) => {
      btn.addEventListener('click', () => {
        addTarget = null;
        startAdd(btn.dataset.add);
      });
    });

    // 追加方法の選択（「なし」のマスや、編集画面の「＋追加」から）
    function openChooser(day, type) {
      addTarget = { day, type };
      $('chooser-title').textContent = `${formatDay(day)}の${TYPES[type].label}に追加`;
      openLayer($('chooser'));
    }
    document.querySelectorAll('[data-choose]').forEach((btn) => {
      btn.addEventListener('click', async () => {
        const how = btn.dataset.choose;
        if (how === 'quiet') {
          await closeLayer();
          openQuietCam();
        } else {
          startAdd(how); // ファイル選択はタップの直後に呼ぶ必要があるので先に開く
          closeLayer();
        }
      });
    });
    $('chooser-cancel').addEventListener('click', () => {
      addTarget = null;
      closeLayer();
    });

    // =====================================================
    // 静音カメラ（カメラ映像の1コマを保存するので音が鳴らない）
    // =====================================================
    const video = $('quiet-video');
    const camMsg = $('cam-msg');
    let stream = null;

    function stopStream() {
      if (stream) stream.getTracks().forEach((t) => t.stop());
      stream = null;
      video.srcObject = null;
    }

    async function openQuietCam() {
      openLayer($('quiet-cam'), { onClose: stopStream });
      camMsg.textContent = 'カメラを起動中…';
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1920 } },
          audio: false,
        });
        if (topLayer() !== $('quiet-cam')) return stopStream(); // 起動中に閉じられた
        video.srcObject = stream;
        camMsg.textContent = '';
      } catch (e) {
        camMsg.textContent = e.name === 'NotAllowedError'
          ? 'カメラの使用が許可されていません。Chromeのアドレスバー左のアイコンから、カメラを「許可」にしてください。'
          : 'カメラを起動できませんでした：' + e.message;
      }
    }

    $('cam-cancel').addEventListener('click', closeLayer);

    $('shutter').addEventListener('click', async () => {
      if (!stream || video.readyState < 2) return; // 映像がまだ来ていない
      const flash = $('flash');
      flash.classList.add('on');
      requestAnimationFrame(() => requestAnimationFrame(() => flash.classList.remove('on')));
      const bitmap = await createImageBitmap(video); // 今のコマを確保してから閉じる
      await closeLayer();
      try {
        await receivePhotos([await makePhoto(bitmap, 'quiet', null, Date.now())]);
      } catch (e) {
        toast('写真を保存できませんでした：' + e.message, 5000);
      }
    });

    // 静音カメラを開いたまま別のアプリに切り替えたら、カメラを止める
    document.addEventListener('visibilitychange', () => {
      if (document.hidden && topLayer() === $('quiet-cam')) closeLayer();
    });

    // =====================================================
    // 撮影後の確認（日付・種類を確かめて保存）
    // =====================================================
    let pending = null;
    let confirmDone = false;
    const confirmUrls = makeUrlCache();

    function openConfirm(photos) {
      const first = Math.min(...photos.map((p) => p.takenAt));
      pending = { photos, day: dayKey(first), type: typeByTime(first) };
      confirmDone = false;
      renderConfirm();
      openLayer($('confirm'), {
        beforeClose: () => confirmDone || confirm('写真を追加せずに閉じますか？'),
        onClose: () => {
          pending = null;
          confirmUrls.clear();
        },
      });
    }

    async function renderConfirm() {
      const row = $('confirm-photos');
      row.innerHTML = '';
      pending.photos.forEach((p, i) => {
        const img = document.createElement('img');
        img.src = confirmUrls.get(p.blob);
        img.alt = `写真${i + 1}`;
        img.addEventListener('click', () => openViewer(pending.photos, i, null));
        row.appendChild(img);
      });

      $('confirm-date').value = pending.day;

      const types = $('confirm-types');
      types.innerHTML = '';
      for (const key of TYPE_ORDER) {
        const b = document.createElement('button');
        b.className = 'type-btn' + (pending.type === key ? ' selected' : '');
        b.textContent = `${TYPES[key].icon} ${TYPES[key].label}`;
        b.addEventListener('click', () => {
          pending.type = key;
          renderConfirm();
        });
        types.appendChild(b);
      }

      // すでに写真がある場合は、そこに追加されることを知らせる
      const { day, type } = pending;
      const slot = await getSlot(slotKey(day, type));
      if (!pending || pending.day !== day || pending.type !== type) return; // 途中で変わった
      $('confirm-note').textContent = slot
        ? `この日の${TYPES[type].label}にはすでに${slot.photos.length}枚あります。そこに追加します。`
        : '';
    }

    $('confirm-date').addEventListener('change', () => {
      if ($('confirm-date').value) {
        pending.day = $('confirm-date').value;
        renderConfirm();
      }
    });
    $('confirm-cancel').addEventListener('click', closeLayer);
    $('confirm-save').addEventListener('click', async () => {
      if (!pending) return;
      const { day, type, photos } = pending;
      try {
        await addPhotosToSlot(day, type, photos);
        confirmDone = true;
        closeLayer();
        toast(`${formatDay(day)}の${TYPES[type].label}に保存しました`);
        refreshAll();
      } catch (e) {
        toast('保存に失敗しました：' + e.message, 5000);
      }
    });

    // =====================================================
    // 日の編集画面（代表の変更・写真の削除・種類の移動・追加）
    // =====================================================
    let editingDay = null;
    const editorUrls = makeUrlCache();

    function openDayEditor(day) {
      editingDay = day;
      $('ed-title').textContent = `${formatDay(day)}の編集`;
      $('day-editor').scrollTop = 0;
      renderDayEditor();
      openLayer($('day-editor'), {
        onClose: () => {
          editingDay = null;
          editorUrls.clear();
        },
      });
    }

    async function renderDayEditor() {
      if (!editingDay) return;
      const day = editingDay;
      const slots = await getDaySlots(day);
      if (editingDay !== day) return;
      editorUrls.clear();
      const body = $('ed-body');
      body.innerHTML = '';

      for (const type of TYPE_ORDER) {
        const slot = slots.find((s) => s.type === type);
        const sec = document.createElement('section');
        sec.className = 'ed-sec';
        sec.innerHTML = `
          <div class="ed-head">${TYPES[type].icon} ${TYPES[type].label}
            <button class="ed-add">＋追加</button>
          </div>`;
        sec.querySelector('.ed-add').addEventListener('click', () => openChooser(day, type));

        if (!slot) {
          sec.insertAdjacentHTML('beforeend', '<div class="ed-none">なし</div>');
        } else {
          const grid = document.createElement('div');
          grid.className = 'ed-photos';
          slot.photos.forEach((p, i) => {
            const isCover = p.id === slot.cover;
            const div = document.createElement('div');
            div.className = 'ed-photo' + (isCover ? ' cover' : '');
            div.innerHTML = `
              <img alt="写真${i + 1}">
              <button class="star" aria-label="代表にする">${isCover ? '★' : '☆'}</button>
              <button class="remove" aria-label="削除">×</button>
              <select aria-label="種類を移動">
                ${TYPE_ORDER.map((t) => `<option value="${t}"${t === type ? ' selected' : ''}>${TYPES[t].label}${t === type ? '' : 'へ移動'}</option>`).join('')}
              </select>`;
            div.querySelector('img').src = editorUrls.get(p.blob);
            div.querySelector('img').addEventListener('click', () => openViewer(slot.photos, i, slot.key));
            div.querySelector('.star').addEventListener('click', async () => {
              await setCover(slot.key, p.id);
              refreshAll();
            });
            div.querySelector('.remove').addEventListener('click', async () => {
              if (!confirm('この写真を削除しますか？')) return;
              await takePhoto(slot.key, p.id);
              toast('削除しました');
              refreshAll();
            });
            div.querySelector('select').addEventListener('change', async (e) => {
              await movePhoto(slot.key, p.id, e.target.value);
              toast(`${TYPES[e.target.value].label}へ移動しました`);
              refreshAll();
            });
            grid.appendChild(div);
          });
          sec.appendChild(grid);
        }
        body.appendChild(sec);
      }
    }

    $('ed-close').addEventListener('click', closeLayer);

    // =====================================================
    // 写真の拡大表示
    // =====================================================
    let viewerPhotos = [];
    let viewerIndex = 0;
    let viewerSlotKey = null; // 代表を変えられるのは、保存済みの写真のときだけ
    let viewerCover = null;
    let viewerUrl = null;

    async function openViewer(photos, index, key) {
      viewerPhotos = photos;
      viewerIndex = index;
      viewerSlotKey = key;
      viewerCover = key ? (await getSlot(key))?.cover : null;
      renderViewer();
      openLayer($('viewer'), {
        onClose: () => {
          URL.revokeObjectURL(viewerUrl);
          viewerUrl = null;
        },
      });
    }

    function renderViewer() {
      const p = viewerPhotos[viewerIndex];
      if (viewerUrl) URL.revokeObjectURL(viewerUrl);
      viewerUrl = URL.createObjectURL(p.blob);
      $('viewer-img').src = viewerUrl;
      const many = viewerPhotos.length > 1;
      $('viewer-count').textContent = many ? `${viewerIndex + 1} / ${viewerPhotos.length}` : '';
      $('viewer-prev').style.display = many ? '' : 'none';
      $('viewer-next').style.display = many ? '' : 'none';

      const coverBtn = $('viewer-cover');
      coverBtn.style.display = viewerSlotKey && many ? '' : 'none';
      const isCover = p.id === viewerCover;
      coverBtn.textContent = isCover ? '★ 代表写真' : '☆ 代表にする';
      coverBtn.classList.toggle('is-cover', isCover);

      const info = [p.takenAt ? formatDateTime(p.takenAt) : '', SOURCE_ICON[p.source], formatSize(p.blob.size)];
      if (p.width) info.push(`${p.width}×${p.height}`);
      if (p.originalSize) info.push(`元 ${formatSize(p.originalSize)}`);
      $('viewer-info').textContent = info.filter(Boolean).join('・');
    }

    function moveViewer(step) {
      const n = viewerPhotos.length;
      if (n < 2) return;
      viewerIndex = (viewerIndex + step + n) % n;
      renderViewer();
    }

    $('viewer-cover').addEventListener('click', async () => {
      const p = viewerPhotos[viewerIndex];
      if (!viewerSlotKey || p.id === viewerCover) return;
      await setCover(viewerSlotKey, p.id);
      viewerCover = p.id;
      renderViewer();
      toast('代表写真にしました');
      refreshAll();
    });
    $('viewer-close').addEventListener('click', closeLayer);
    $('viewer-prev').addEventListener('click', () => moveViewer(-1));
    $('viewer-next').addEventListener('click', () => moveViewer(1));

    // 左右にスワイプで切り替え
    let touchX = null;
    $('viewer').addEventListener('touchstart', (e) => (touchX = e.touches[0].clientX), { passive: true });
    $('viewer').addEventListener('touchend', (e) => {
      if (touchX === null) return;
      const dx = e.changedTouches[0].clientX - touchX;
      touchX = null;
      if (Math.abs(dx) > 50) moveViewer(dx < 0 ? 1 : -1);
    });

    // PC ではキーボードでも操作できる
    document.addEventListener('keydown', (e) => {
      if (topLayer() !== $('viewer')) return;
      if (e.key === 'ArrowLeft') moveViewer(-1);
      if (e.key === 'ArrowRight') moveViewer(1);
      if (e.key === 'Escape') closeLayer();
    });

    // =====================================================
    // 一覧（1日 = 朝食・昼食・夕食・間食の4マス）
    // =====================================================
    const listUrls = makeUrlCache();

    async function showList() {
      const list = $('list');
      const slots = await getAllSlots();
      listUrls.clear();

      const byDay = new Map();
      for (const s of slots) {
        if (!byDay.has(s.day)) byDay.set(s.day, {});
        byDay.get(s.day)[s.type] = s;
      }
      const today = dayKey(Date.now());
      if (!byDay.has(today)) byDay.set(today, {}); // 今日は記録がなくても出す

      list.innerHTML = '';
      if (slots.length > 0) {
        const photoCount = slots.reduce((n, s) => n + s.photos.length, 0);
        const total = slots.reduce((n, s) => n + s.photos.reduce((t, p) => t + p.blob.size, 0), 0);
        const dayCount = new Set(slots.map((s) => s.day)).size;
        list.innerHTML = `<p class="summary">${dayCount}日分・写真${photoCount}枚・合計 ${formatSize(total)}</p>`;
      }

      [...byDay.keys()].sort().reverse().forEach((day) => {
        const daySlots = byDay.get(day);
        const sec = document.createElement('section');
        sec.className = 'day';
        sec.innerHTML = `
          <div class="day-head">
            <span class="day-title">${formatDay(day)}${day === today ? '<span class="today">今日</span>' : ''}</span>
            <button class="day-edit">✎ 編集</button>
          </div>
          <div class="day-grid"></div>`;
        sec.querySelector('.day-edit').addEventListener('click', () => openDayEditor(day));
        const grid = sec.querySelector('.day-grid');

        for (const type of TYPE_ORDER) {
          const slot = daySlots[type];
          const cell = document.createElement('div');
          cell.innerHTML = `<div class="cell-label">${TYPES[type].label}</div>`;
          const box = document.createElement('button');
          box.className = 'cell-box';
          if (slot) {
            const coverIndex = Math.max(0, slot.photos.findIndex((p) => p.id === slot.cover));
            const img = document.createElement('img');
            img.alt = `${formatDay(day)}の${TYPES[type].label}`;
            img.loading = 'lazy';
            img.src = listUrls.get(slot.photos[coverIndex].blob);
            box.appendChild(img);
            if (slot.photos.length > 1) {
              box.insertAdjacentHTML('beforeend', `<span class="badge">❐${slot.photos.length}</span>`);
            }
            box.addEventListener('click', () => openViewer(slot.photos, coverIndex, slot.key));
          } else {
            box.classList.add('none');
            box.innerHTML = 'なし<br>＋';
            box.setAttribute('aria-label', `${formatDay(day)}の${TYPES[type].label}を追加`);
            box.addEventListener('click', () => openChooser(day, type));
          }
          cell.appendChild(box);
          grid.appendChild(cell);
        }
        list.appendChild(sec);
      });
    }

    function refreshAll() {
      showList();
      renderDayEditor();
    }

    // =====================================================
    // バックアップ（暗号化した ZIP = .mlbk）
    // ZIP の中身:
    //   records.json … 食事の情報（日付・種類・代表・写真ごとの撮影日時など）
    //   photos/2026-11-24_lunch_1.jpg … 写真
    // =====================================================
    // パスワードはアプリに埋め込み（このアプリ以外では開けないようにするのが目的）。
    // ※ この文字列を変えると、それ以前のバックアップが読めなくなるので変更しないこと
    const BACKUP_PASSWORD = 'meal-log/7f3c9a1e-backup-key/2026';
    const MAGIC = new TextEncoder().encode('MLBK1'); // ファイルの先頭に付ける目印

    async function deriveKey(salt) {
      const base = await crypto.subtle.importKey(
        'raw', new TextEncoder().encode(BACKUP_PASSWORD), 'PBKDF2', false, ['deriveKey']);
      return crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt, iterations: 100000, hash: 'SHA-256' },
        base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
    }

    // ファイルの並び: 目印(5) + salt(16) + iv(12) + 暗号化されたZIP
    async function encryptBackup(zipBlob) {
      const salt = crypto.getRandomValues(new Uint8Array(16));
      const iv = crypto.getRandomValues(new Uint8Array(12));
      const key = await deriveKey(salt);
      const data = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, key, await zipBlob.arrayBuffer());
      return new Blob([MAGIC, salt, iv, data], { type: 'application/octet-stream' });
    }

    function isEncrypted(bytes) {
      return MAGIC.every((b, i) => bytes[i] === b);
    }

    async function decryptBackup(bytes) {
      const key = await deriveKey(bytes.slice(5, 21));
      try {
        return await crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes.slice(21, 33) }, key, bytes.slice(33));
      } catch {
        throw new Error('バックアップを解読できませんでした（ファイルが壊れている可能性があります）');
      }
    }

    $('export-btn').addEventListener('click', async () => {
      const slots = await getAllSlots();
      if (slots.length === 0) {
        toast('バックアップする記録がありません');
        return;
      }
      toast('バックアップを作成中…', 0);
      try {
        const zip = new JSZip();
        const list = slots.map((s) => ({
          day: s.day,
          type: s.type,
          cover: s.cover,
          photos: s.photos.map((p, i) => {
            const file = `photos/${s.day}_${s.type}_${i + 1}.jpg`;
            zip.file(file, p.blob); // JPEG は圧縮済みなので、そのまま入れる
            const { blob, ...info } = p;
            return { ...info, file };
          }),
        }));
        zip.file('records.json', JSON.stringify({ app: 'meal-log', version: 3, slots: list }, null, 2), {
          compression: 'DEFLATE',
        });
        const blob = await encryptBackup(await zip.generateAsync({ type: 'blob' }));
        const name = `meal-log-backup_${stamp(Date.now())}.mlbk`;

        // ダウンロードとして保存（誤送信を防ぐため、共有メニューは使わない）
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = name;
        a.click();
        setTimeout(() => URL.revokeObjectURL(url), 10000);
        const photoCount = slots.reduce((n, s) => n + s.photos.length, 0);
        toast(`ダウンロードしました（写真${photoCount}枚・${formatSize(blob.size)}）`, 4000);
      } catch (e) {
        toast('バックアップに失敗しました：' + e.message, 5000);
      }
    });

    const importFile = $('import-file');
    importFile.addEventListener('change', async () => {
      const file = importFile.files[0];
      importFile.value = '';
      if (!file) return;
      toast('読み込み中…', 0);
      try {
        // 暗号化バックアップ(.mlbk)なら解読、以前の ZIP ならそのまま読む
        const bytes = new Uint8Array(await file.arrayBuffer());
        const zipData = isEncrypted(bytes) ? await decryptBackup(bytes) : bytes;
        let zip;
        try {
          zip = await JSZip.loadAsync(zipData);
        } catch {
          throw new Error('食事記録アプリのバックアップではありません');
        }
        const json = zip.file('records.json');
        if (!json) throw new Error('食事記録アプリのバックアップではありません');
        const data = JSON.parse(await json.async('string'));

        // どの形式でも「日・種類・写真(file付き)」の並びにそろえる
        let parts;
        if (data.slots) {
          parts = data.slots; // 今の形式
        } else if (data.meals) {
          parts = data.meals.map(fromV2Meal); // 食事単位だった形式
        } else if (data.records) {
          parts = data.records.map((r) => {
            const part = fromV1Record(r, null); // 写真1枚=1件だった形式
            part.photos[0].file = r.file;
            return part;
          });
        } else {
          throw new Error('食事記録アプリのバックアップではありません');
        }

        // すでにある写真（同じid）は飛ばす → 何度読み込んでも重複しない
        const existing = new Set((await getAllSlots()).flatMap((s) => s.photos.map((p) => p.id)));
        let added = 0;
        let skipped = 0;
        for (const part of parts) {
          const photos = [];
          for (const p of part.photos) {
            const f = zip.file(p.file);
            if (existing.has(p.id) || !f) {
              skipped++;
              continue;
            }
            const { file: _, ...info } = p;
            photos.push({ ...info, blob: new Blob([await f.async('arraybuffer')], { type: 'image/jpeg' }) });
            existing.add(p.id);
          }
          if (photos.length === 0) continue;
          await addPhotosToSlot(part.day, part.type, photos, part.cover);
          added += photos.length;
        }
        toast(`読み込みました：写真${added}枚を追加` + (skipped ? `・重複などで飛ばした ${skipped}枚` : ''), 4000);
        refreshAll();
      } catch (e) {
        toast('読み込みに失敗しました：' + e.message, 5000);
      }
    });

    showList().catch((e) => toast('データを開けませんでした：' + e.message, 8000));
  </script>
</body>
</html>
